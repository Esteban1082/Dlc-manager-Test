<!DOCTYPE html>
<html lang="fr">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src * blob: data:; script-src * 'unsafe-inline' 'unsafe-eval' blob:; style-src * 'unsafe-inline'; connect-src *; img-src * blob: data:; worker-src * blob:; media-src * blob:;">
<script>
// Guard — bloque l'accès si pas de permission
document.documentElement.style.visibility = 'hidden';
window.__guardPassed = undefined; // undefined = en cours, true = OK, false = bloqué

(async () => {
  const pm  = localStorage.getItem('pm_auth') === '1';
  const sl  = localStorage.getItem('sl_auth') === '1';
  const tok = localStorage.getItem('sl_access_token');

  function showBlock(title, sub) {
    document.documentElement.style.visibility = 'visible';
    // Attendre que le body existe
    const render = () => {
      if (!document.body) { requestAnimationFrame(render); return; }
      document.body.innerHTML = `<div style="position:fixed;inset:0;background:#0f0f0d;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;text-align:center;padding:20px"><div><div style="font-size:48px;margin-bottom:16px">🚫</div><div style="font-family:'Fraunces',serif;font-size:22px;font-weight:900;color:#e8a045;margin-bottom:8px">${title}</div><div style="font-size:13px;color:#7a7a6e;margin-bottom:24px">${sub}</div><a href="hub.html" style="padding:14px 28px;background:#e8a045;border-radius:12px;font-family:'Fraunces',serif;font-size:16px;font-weight:700;color:#000;text-decoration:none">← Retour au hub</a></div></div>`;
    };
    render();
  }

  function allow() {
    window.__guardPassed = true;
    document.documentElement.style.visibility = 'visible';
  }

  // Pas connecté du tout
  if (!pm && !sl) {
    showBlock('Accès restreint', 'Connecte-toi depuis le hub');
    return;
  }

  // Connecté via Supabase → vérifier permission
  if (tok && sl) {
    const user = JSON.parse(localStorage.getItem('sl_user') || '{}');
    // Admin/superadmin → accès libre
    if (['superadmin','admin'].includes(user.role)) { allow(); return; }
    if (!user.id) { allow(); return; }
    try {
      const r = await fetch(
        'https://jeqptodorjzeyhapbmrz.supabase.co/rest/v1/permissions?user_id=eq.' + user.id + '&module=eq.pertes&actif=eq.true&select=id',
        { headers: { 'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImplcXB0b2Rvcmp6ZXloYXBibXJ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NjI0ODksImV4cCI6MjA4OTIzODQ4OX0.j4JqeDnDMEghnBtKy5Knpb4QYDFEXiRtDeq7SSz3zWk', 'Authorization': 'Bearer ' + tok } }
      );
      const perms = await r.json();
      if (!Array.isArray(perms) || perms.length === 0) {
        showBlock('Module non activé', "Parle à Esteban pour obtenir l\'accès");
        return;
      }
      allow();
    } catch(e) { allow(); }
    return;
  }

  // PIN uniquement → accès libre
  allow();
})();
</script>

<title>StoreLine</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,wght@0,300;0,600;0,900;1,300&display=swap" rel="stylesheet">
<script>
(function(){
  try {
    var t = localStorage.getItem('sl_ui_theme') || 'light';
    if (t === 'light') document.documentElement.dataset.theme = 'light';
  } catch(e) {}
})();
</script>
<style>
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  :root {
    --bg:#0f0f0d; --surface:#1a1a16; --border:#2e2e28;
    --text:#f0ede4; --muted:#7a7a6e; --amber:#e8a045;
    --red:#ff4040; --red-bg:rgba(255,64,64,.10);
    --yellow:#f5c842; --green:#4cdb8a;
  }
  /* StoreLine theme */
  html[data-theme="light"] {
    --bg:#f7f3eb; --surface:#fffdf8; --surface2:#f0e8dc;
    --border:#e0d6c7; --border2:#c9bca9;
    --text:#211d18; --muted:#766b5f;
    --amber:#b96f22; --amber2:#d9913d;
    --red:#c93636; --red-bg:rgba(201,54,54,.10);
    --yellow:#b98916; --yellow-bg:rgba(185,137,22,.12);
    --green:#167a4a; --green-bg:rgba(22,122,74,.10);
    --blue:#1f75a8; --purple:#7c55c7;
    --grey:#8d8378; --grey-bg:rgba(141,131,120,.12);
  }
  body { transition:background .18s ease,color .18s ease; }
  .theme-toggle-global {
    position:fixed; top:12px; right:12px; z-index:1200;
    min-width:70px; height:34px; border-radius:999px; padding:0 12px;
    display:flex; align-items:center; justify-content:center;
    background:var(--surface); color:var(--amber);
    border:1px solid var(--border); box-shadow:0 10px 24px rgba(0,0,0,.18);
    font-size:11px;font-weight:700; cursor:pointer; line-height:1;
  }
  .theme-toggle-global:hover { border-color:var(--amber); color:var(--amber2); transform:translateY(-1px); }
  html[data-theme="light"] .theme-toggle-global { box-shadow:0 10px 24px rgba(84,62,37,.12); }
  @media(max-width:640px){ .theme-toggle-global { top:auto; right:12px; bottom:72px; } }

  body { background:var(--bg); color:var(--text); font-family:'DM Mono',monospace; min-height:100vh; }
  button { transition:all .15s; cursor:pointer; }
  button:active { transform:scale(0.97); }

  header {
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 24px; border-bottom:1px solid var(--border);
    position:sticky; top:0; background:var(--bg); z-index:100;
  }
  .logo-title { font-family:'Fraunces',serif; font-weight:900; font-size:20px; color:var(--amber); }
  .logo-sub   { font-size:10px; color:var(--muted); letter-spacing:2px; text-transform:uppercase; margin-top:2px; }
  .back-btn {
    padding:7px 14px; background:transparent; border:1px solid var(--border);
    border-radius:8px; color:var(--muted); font-family:'DM Mono',monospace;
    font-size:11px; text-decoration:none; display:flex; align-items:center; gap:6px;
  }
  .back-btn:hover { border-color:var(--amber); color:var(--text); }

  .main { padding:20px 24px 80px; max-width:700px; margin:0 auto; }

  .filter-btn {
    padding:7px 14px; border-radius:8px; border:1px solid var(--border);
    background:transparent; color:var(--muted); font-family:'DM Mono',monospace;
    font-size:11px; letter-spacing:1px; text-transform:uppercase;
  }
  .filter-btn:hover { border-color:var(--amber); color:var(--text); }
  .filter-btn.active { background:var(--amber); color:#000; border-color:var(--amber); }

  .barcode-row { display:flex; gap:8px; }

  .histo-section-title {
    display:flex; align-items:center; gap:10px;
    font-size:11px; color:var(--muted); letter-spacing:2px;
    text-transform:uppercase; margin:20px 0 10px;
  }
  .histo-section-title::after { content:''; flex:1; height:1px; background:var(--border); }

  .modal-overlay {
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.7);
    backdrop-filter:blur(4px); z-index:600;
    align-items:center; justify-content:center; padding:20px;
    animation:fadeIn .2s ease;
  }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  .modal {
    background:var(--surface); border:1px solid var(--border);
    border-radius:16px; padding:28px; width:100%; max-width:420px;
  }
  .modal-title { font-family:'Fraunces',serif; font-size:20px; font-weight:700; color:var(--amber); margin-bottom:20px; }

  .toast-container { position:fixed; bottom:24px; right:24px; z-index:700; display:flex; flex-direction:column; gap:8px; }
  .toast {
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    padding:12px 18px; font-size:13px; display:flex; align-items:center; gap:10px;
    animation:slideIn .2s ease; max-width:320px;
  }
  @keyframes slideIn { from{transform:translateX(100%);opacity:0} to{transform:translateX(0);opacity:1} }

  .version-tag { position:fixed; bottom:10px; left:14px; font-size:10px; color:var(--border); letter-spacing:1px; z-index:50; }

  /* Scanner modal */
  #modal-scanner { display:none; position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:700;
    align-items:center; justify-content:center; padding:20px; }
  .theme-toggle-global, #theme-toggle { display:none !important; }
</style>

<style id="sl-ui">

    --text:#f4efe7; --muted:#a3978a; --amber:#e8a045; --amber2:#f0b264;
    --red:#ff7a6e; --red-bg:rgba(255,122,110,.12); --yellow:#f0b450; --yellow-bg:rgba(240,180,80,.12);
    --green:#6fcf97; --green-bg:rgba(111,207,151,.12); --blue:#7fb8ff; --purple:#b9a2ff;
    --grey:#9a8f84; --grey-bg:rgba(154,143,132,.12);

  html[data-theme="light"] {
    --bg:#f4efe7; --surface:#fffcf7; --surface2:#f1e6d6; --border:#e2d7c9; --border2:#cfc2b2;

    --red:#b3261e; --red-bg:#fbece9; --yellow:#8a5a00; --yellow-bg:#fbf2e1;
    --green:#2f6b45; --green-bg:#ecf3ec; --blue:#1f6aa5; --purple:#6b4fc0;
    --grey:#857a6f; --grey-bg:rgba(133,122,111,.12);

  :root { --ui-sans:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Helvetica Neue', sans-serif; --ui-serif:'Fraunces', Georgia, serif; }
  html body { background:var(--bg) !important; color:var(--text); -webkit-font-smoothing:antialiased; }
  html body, html body * { font-family:var(--ui-sans) !important; }

  .modal { border-radius:22px !important; border:none !important; box-shadow:0 20px 60px rgba(0,0,0,.18) !important; background:var(--surface) !important; }
  .form-input, input[type="text"], input[type="email"], input[type="password"], input[type="number"], input[type="date"], input[type="search"], select, textarea { border-radius:12px !important; }
  .toast { border-radius:14px !important; box-shadow:var(--ui-shadow) !important; }
  .theme-toggle-global, #theme-toggle { display:none !important; }
</style>
<style id="sl-mod">

  :root { --sl-w:700px; --fill:#e8a045; }
  html body { font-size:15px; }
  /* En-tête */

  /* Titres de section */
  .main [style*="Fraunces"][style*="color:var(--amber)"], .content [style*="Fraunces"][style*="color:var(--amber)"], .section-title, .panier-header > div:first-child { color:var(--text) !important; font-weight:700 !important; }

  /* Contrôles segmentés (filtres et onglets) */

  /* Cartes et lignes */

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbz425iBOjYC8raof6W44y0IcJlCZHzjOrMzzjw0ju8uXFCKvFSl-xmYi9tZvOoSvP0aZg/exec";
const SUPABASE_URL  = 'https://jeqptodorjzeyhapbmrz.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImplcXB0b2Rvcmp6ZXloYXBibXJ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NjI0ODksImV4cCI6MjA4OTIzODQ4OX0.j4JqeDnDMEghnBtKy5Knpb4QYDFEXiRtDeq7SSz3zWk';

let sheetProducts = [];
let pertesData = [];
let pertesFilter = 'semaine';
let selectedPerte = null;
let _apiCallId = 0;
let html5Scanner = null;
let dataSource = 'apps';
let produitsSource = 'apps';

function api(params) {
  return new Promise((resolve, reject) => {
    const cbName = 'dlcCb_' + (++_apiCallId);
    const script = document.createElement('script');
    const timer = setTimeout(() => { cleanup(); reject(new Error('Timeout')); }, 20000);
    window[cbName] = (data) => { cleanup(); resolve(data); };
    function cleanup() { clearTimeout(timer); delete window[cbName]; if (script.parentNode) script.remove(); }
    script.onerror = () => { cleanup(); reject(new Error('Erreur réseau')); };
    const p = new URLSearchParams({ ...params, callback: cbName });
    script.src = API_URL + '?' + p.toString();
    document.head.appendChild(script);
  });
}

function getStoredUser() {
  try { return JSON.parse(localStorage.getItem('sl_user') || '{}'); }
  catch(e) { return {}; }
}

function canUseSupabase() {
  return !!localStorage.getItem('sl_access_token');
}

async function sbRpcScalar(functionName, accessToken) {
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${functionName}`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON,
        'Authorization': `Bearer ${accessToken}`,
      },
      body: '{}',
    });
    if (!r.ok) return null;
    const text = await r.text();
    return text ? JSON.parse(text) : null;
  } catch(e) {
    return null;
  }
}

async function ensureSupabaseUserReady() {
  const token = localStorage.getItem('sl_access_token');
  let stored = getStoredUser();
  if (!token || stored.tenant_id) return stored;

  try {
    const authResp = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
      headers: { 'apikey': SUPABASE_ANON, 'Authorization': `Bearer ${token}` },
    });
    const authUser = authResp.ok ? await authResp.json() : {};
    let profile = null;
    const userId = authUser.id || stored.id;

    if (userId) {
      const profileResp = await fetch(`${SUPABASE_URL}/rest/v1/profiles?id=eq.${userId}&select=role,tenant_id`, {
        headers: { 'apikey': SUPABASE_ANON, 'Authorization': `Bearer ${token}` },
      });
      if (profileResp.ok) {
        const data = await profileResp.json();
        profile = Array.isArray(data) ? data[0] : null;
      }
    }

    if (!profile?.role || !profile?.tenant_id) {
      const [role, tenantId] = await Promise.all([
        sbRpcScalar('my_role', token),
        sbRpcScalar('my_tenant_id', token),
      ]);
      profile = {
        role: profile?.role || role || stored.role || 'employe',
        tenant_id: profile?.tenant_id || tenantId || null,
      };
    }

    stored = {
      id: userId || stored.id,
      email: authUser.email || stored.email,
      role: profile?.role || stored.role || 'employe',
      tenant_id: profile?.tenant_id || stored.tenant_id || null,
    };
    localStorage.setItem('sl_user', JSON.stringify(stored));
  } catch(e) {
    console.warn('[supabase] Session repair failed:', e.message);
  }

  return stored;
}

async function sbFetch(path, options={}) {
  const token = localStorage.getItem('sl_access_token');
  const r = await fetch(SUPABASE_URL + path, {
    ...options,
    headers: {
      'apikey': SUPABASE_ANON,
      'Authorization': `Bearer ${token}`,
      'Content-Type': 'application/json',
      'Prefer': 'return=representation',
      ...(options.headers || {})
    }
  });
  const text = await r.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch(e) { data = text; }
  if (!r.ok) throw new Error((data && (data.message || data.error)) || `Supabase ${r.status}`);
  return data;
}

function normalizePerteRow(r) {
  return {
    id: r.id || null,
    name: r.name || r.nom || '',
    brand: r.brand || r.marque || '',
    barcode: String(r.barcode || r.code_barres || '').trim(),
    quantity: String(r.quantity || r.quantite || 1),
    date: r.date || r.date_perte || ''
  };
}

async function loadProducts() {
  if (canUseSupabase()) {
    const user = await ensureSupabaseUserReady();
    try {
      if (!user.tenant_id) throw new Error('Tenant Supabase manquant');
      const rows = await sbFetch(`/rest/v1/produits?tenant_id=eq.${encodeURIComponent(user.tenant_id)}&select=id,nom,marque,code_barres,categorie&order=nom.asc`);
      produitsSource = 'supabase';
      sheetProducts = Array.isArray(rows) ? rows : [];
      return;
    } catch(e) {
      console.warn('[pertes] Produits Supabase indisponibles:', e.message);
      produitsSource = 'supabase';
      sheetProducts = [];
      return;
    }
  }
  produitsSource = 'apps';
  const d = await api({ action:'getProducts' });
  if (d.success) sheetProducts = d.products || [];
}

async function loadPertesFromSupabase() {
  const user = await ensureSupabaseUserReady();
  if (!user.tenant_id) throw new Error('Tenant Supabase manquant');
  const rows = await sbFetch(`/rest/v1/pertes?tenant_id=eq.${encodeURIComponent(user.tenant_id)}&select=id,nom,marque,code_barres,quantite,date_perte,created_at&order=date_perte.desc,created_at.desc`);
  return (rows || []).map(normalizePerteRow);
}

async function loadPertesFromAppsScript() {
  const data = await api({ action:'getPertes' });
  return (data.success && data.pertes) ? data.pertes.map(normalizePerteRow) : [];
}

function toast(msg, isError = false) {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = 'toast';
  t.style.borderColor = isError ? 'var(--red)' : 'var(--green)';
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

function fmtDate(str) {
  const d = new Date(str + 'T00:00:00');
  return d.toLocaleDateString('fr-BE', { weekday:'long', day:'numeric', month:'long' });
}

function getProduitFields(p) {
  const keys = Object.keys(p);
  const nomKey    = keys.find(k => /nom_article|^nom$|^name$|article|designation|libelle/i.test(k));
  const marqueKey = keys.find(k => /patissier|marque|brand|fournisseur|fabricant/i.test(k));
  const barcodeKey= keys.find(k => /code_barres|barcode|ean|upc|^code$/i.test(k));
  return {
    nom:     (nomKey     ? String(p[nomKey]     || '') : '').trim(),
    marque:  (marqueKey  ? String(p[marqueKey]  || '') : '').trim(),
    barcode: (barcodeKey ? String(p[barcodeKey] || '') : '').trim(),
  };
}

// ── Recherche produit ──
let pertesSearchTimer = null;
function onPertesInput() {
  clearTimeout(pertesSearchTimer);
  pertesSearchTimer = setTimeout(showPertesDropdown, 200);
}

function showPertesDropdown() {
  const q = document.getElementById('pertes-search').value.toLowerCase().trim();
  const dd = document.getElementById('pertes-suggestions');
  if (!q || q.length < 2) { dd.style.display = 'none'; return; }
  const hits = sheetProducts.filter(p => {
    const f = getProduitFields(p);
    return f.nom.toLowerCase().includes(q) || f.marque.toLowerCase().includes(q) || f.barcode.includes(q);
  }).slice(0, 6);
  if (!hits.length) { dd.style.display = 'none'; return; }
  dd.innerHTML = hits.map(p => {
    const { nom, marque, barcode } = getProduitFields(p);
    return `<div onclick="selectPertesProduct('${nom.replace(/'/g,"\\'")}','${marque.replace(/'/g,"\\'")}','${barcode}')"
      style="padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border);font-size:13px;"
      onmouseover="this.style.background='var(--border)'" onmouseout="this.style.background=''">
      <span style="font-weight:600">${nom}</span>
      <span style="color:var(--muted);font-size:11px;margin-left:8px">${marque}${barcode ? ' · ' + barcode : ''}</span>
    </div>`;
  }).join('');
  dd.style.display = 'block';
}

function hidePertesDropdown() { document.getElementById('pertes-suggestions').style.display = 'none'; }

function searchPertesProduct() {
  const q = document.getElementById('pertes-search').value.toLowerCase().trim();
  if (!q) return;
  const hit = sheetProducts.find(p => {
    const f = getProduitFields(p);
    return f.nom.toLowerCase().includes(q) || f.barcode === q;
  });
  if (hit) {
    const f = getProduitFields(hit);
    selectPertesProduct(f.nom, f.marque, f.barcode);
  } else {
    toast('⚠ Produit non trouvé dans la base', true);
  }
}

function selectPertesProduct(nom, marque, barcode) {
  hidePertesDropdown();
  selectedPerte = { nom, marque, barcode };
  document.getElementById('ps-nom').textContent = nom;
  document.getElementById('ps-meta').textContent = marque + (barcode ? ' · ' + barcode : '');
  document.getElementById('pertes-qty').value = 1;
  document.getElementById('pertes-selected').style.display = 'block';
  document.getElementById('pertes-search').value = '';
}

function clearPertesSelection() {
  selectedPerte = null;
  document.getElementById('pertes-selected').style.display = 'none';
  document.getElementById('pertes-search').value = '';
  document.getElementById('pertes-search').focus();
}

function adjustQty(delta) {
  const inp = document.getElementById('pertes-qty');
  inp.value = Math.max(1, Math.min(999, (parseInt(inp.value) || 1) + delta));
}

async function enregistrerPerte() {
  if (!selectedPerte) return;
  const qty = parseInt(document.getElementById('pertes-qty').value) || 1;
  const { nom, marque, barcode } = selectedPerte;
  toast(`⏳ Enregistrement de ${qty} × ${nom}…`);
  if (dataSource === 'supabase' && canUseSupabase()) {
    const user = getStoredUser();
    try {
      await sbFetch('/rest/v1/pertes', {
        method: 'POST',
        body: JSON.stringify({
          tenant_id: user.tenant_id,
          nom,
          marque,
          code_barres: barcode || null,
          quantite: qty,
          date_perte: new Date().toISOString().slice(0, 10),
          created_by: user.id || null
        })
      });
      toast(`✓ Perte enregistrée — ${qty} × ${nom}`);
      clearPertesSelection();
      pertesData = [];
      loadPertes();
    } catch(e) {
      toast(`⚠ ${e.message}`, true);
    }
    return;
  }
  try {
    const data = await api({ action:'logPerte', name:nom, brand:marque, barcode, quantity:String(qty) });
    if (data && data.success) {
      toast(`✓ Perte enregistrée — ${qty} × ${nom}`);
      clearPertesSelection();
      pertesData = [];
      loadPertes();
    } else {
      toast(`⚠ ${data?.error || 'Mets à jour le Apps Script (action logPerte)'}`, true);
    }
  } catch(e) { toast('⚠ Erreur réseau', true); }
}

// ── Historique ──
function setPertesFilter(f, btn) {
  pertesFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  renderPertes();
}

async function loadPertes() {
  const list = document.getElementById('pertes-list');
  list.innerHTML = '<div style="text-align:center;padding:40px;color:var(--muted)">⏳ Chargement…</div>';
  if (canUseSupabase()) {
    try {
      const rows = await loadPertesFromSupabase();
      dataSource = 'supabase';
      pertesData = rows;
      renderPertes();
      return;
    } catch(e) {
      console.warn('[pertes] Supabase indisponible:', e.message);
      dataSource = 'supabase';
      pertesData = [];
      renderPertes();
      toast('Impossible de charger les pertes Supabase', true);
      return;
    }
  }
  try {
    dataSource = 'apps';
    pertesData = await loadPertesFromAppsScript();
    renderPertes();
  } catch(e) {
    list.innerHTML = '<div style="text-align:center;padding:40px;color:var(--red)">⚠ Erreur réseau</div>';
  }
}

function renderPertes() {
  const now = new Date(); now.setHours(0,0,0,0);
  const filtered = pertesData.filter(h => {
    if (!h.date) return true;
    const d = new Date(h.date + 'T00:00:00');
    if (pertesFilter === 'today')   return d.getTime() === now.getTime();
    if (pertesFilter === 'semaine') { const w = new Date(now); w.setDate(now.getDate()-7);  return d >= w; }
    if (pertesFilter === 'mois')    { const m = new Date(now); m.setDate(now.getDate()-30); return d >= m; }
    return true;
  }).sort((a,b) => (b.date||'').localeCompare(a.date||''));

  const totalQty = filtered.reduce((acc,h) => acc + (parseInt(h.quantity)||1), 0);
  const noms     = new Set(filtered.map(h => h.name));
  document.getElementById('pertes-stats').innerHTML = `
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center">
      <div style="font-family:'Fraunces',serif;font-size:28px;font-weight:900;color:var(--red)">${totalQty}</div>
      <div style="font-size:10px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-top:2px">Unités perdues</div>
    </div>
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center">
      <div style="font-family:'Fraunces',serif;font-size:28px;font-weight:900;color:var(--text)">${noms.size}</div>
      <div style="font-size:10px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-top:2px">Produits distincts · ${dataSource === 'supabase' ? 'Supabase' : 'Sheets'}</div>
    </div>`;

  const list = document.getElementById('pertes-list');
  if (!filtered.length) {
    list.innerHTML = `<div style="text-align:center;padding:60px 20px;color:var(--muted)">
      <div style="font-size:36px;margin-bottom:12px">📉</div>
      <div style="font-family:'Fraunces',serif;font-size:18px;margin-bottom:6px">Aucune perte enregistrée</div>
      <div style="font-size:12px">Recherche ou scanne un produit pour commencer.</div></div>`;
    return;
  }
  const byDate = {};
  filtered.forEach(h => { const k = h.date||'Inconnu'; if (!byDate[k]) byDate[k]=[]; byDate[k].push(h); });
  let html = '';
  for (const [dateKey, items] of Object.entries(byDate)) {
    const label  = dateKey === 'Inconnu' ? 'Date inconnue' : fmtDate(dateKey);
    const dayQty = items.reduce((a,h) => a+(parseInt(h.quantity)||1), 0);
    html += `<div class="histo-section-title">${label}
      <span style="background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:1px 8px;font-size:10px">${dayQty} unité${dayQty>1?'s':''}</span>
    </div>`;
    html += items.map(h => {
      const qty = parseInt(h.quantity)||1;
      return `<div style="background:var(--red-bg);border:1px solid rgba(255,64,64,.25);border-radius:10px;padding:12px 14px;margin-bottom:6px;display:flex;align-items:center;gap:10px">
        <div style="flex:1;min-width:0">
          <div style="font-family:'Fraunces',serif;font-size:11px;font-weight:700;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${h.name||''}</div>
          <div style="font-size:11px;color:var(--muted);margin-top:2px">${h.brand||''}${h.barcode?' · '+h.barcode:''}</div>
        </div>
        <div style="flex-shrink:0;text-align:center;min-width:42px">
          <div style="font-family:'Fraunces',serif;font-size:22px;font-weight:900;color:var(--red);line-height:1">${qty}</div>
          <div style="font-size:9px;color:var(--muted);letter-spacing:1px;text-transform:uppercase">unité${qty>1?'s':''}</div>
        </div>
      </div>`;
    }).join('');
  }
  list.innerHTML = html;
}

// ── Scanner ──
function preloadScanner() { /* lib chargée statiquement dans le head */ }

async function openPertesScanner() {
  const modal = document.getElementById('modal-scanner');
  modal.style.display = 'flex';
  document.getElementById('scan-status').textContent = 'Chargement du scanner…';
  document.getElementById('scanner-inner').innerHTML = '';
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  for (let i = 0; i < 20; i++) {
    if (window.Html5Qrcode) break;
    await new Promise(r => setTimeout(r, 300));
  }
  if (!window.Html5Qrcode) {
    document.getElementById('scan-status').textContent = 'Scanner non disponible';
    return;
  }
  try {
    html5Scanner = new Html5Qrcode('scanner-inner');
    await html5Scanner.start(
      { facingMode:'environment' },
      { fps:15, qrbox:{width:250,height:150}, aspectRatio:1.5,
        formatsToSupport:[
          Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.CODE_39,
          Html5QrcodeSupportedFormats.UPC_A,   Html5QrcodeSupportedFormats.UPC_E,
        ]
      },
      (code) => onPertesScan(code), () => {}
    );
    document.getElementById('scan-status').textContent = 'Centrez le code dans le cadre…';
  } catch(e) {
    document.getElementById('scan-status').textContent = '' + e;
  }
}

function onPertesScan(code) {
  closeScanner();
  if (window.navigator.vibrate) navigator.vibrate(80);
  const hit = sheetProducts.find(p => {
    const f = getProduitFields(p);
    return f.barcode === code || f.barcode === String(code);
  });
  if (hit) {
    const f = getProduitFields(hit);
    selectPertesProduct(f.nom, f.marque, f.barcode);
    toast(`📷 Produit trouvé : ${f.nom}`);
  } else {
    toast(`⚠ Code ${code} non trouvé dans la base`, true);
  }
}

async function closeScanner() {
  if (html5Scanner) {
    try { if (html5Scanner.isScanning) await html5Scanner.stop(); html5Scanner.clear(); } catch(e) {}
    html5Scanner = null;
  }
  document.getElementById('scanner-inner').innerHTML = '';
  document.getElementById('modal-scanner').style.display = 'none';
}

// ── Init ──
async function init() {
  preloadScanner();
  try {
    await loadProducts();
  } catch(e) {}
  loadPertes();
}
// Attendre que le guard soit résolu ET que le DOM soit prêt
function _runWhenReady() {
  if (window.__guardPassed === true) {
    init();
  } else if (window.__guardPassed === false) {
    // Bloqué — ne rien faire
  } else {
    // Guard encore en cours — réessayer
    setTimeout(_runWhenReady, 50);
  }
}
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', _runWhenReady);
} else {
  _runWhenReady();
}
</script>
