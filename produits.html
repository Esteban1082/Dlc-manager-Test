<!DOCTYPE html>
<html lang="fr">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src * blob: data:; script-src * 'unsafe-inline' 'unsafe-eval' blob:; style-src * 'unsafe-inline'; connect-src *; img-src * blob: data:; worker-src * blob:; media-src * blob:;">
<script>
// Guard — bloque l'accès si pas de permission
document.documentElement.style.visibility = 'hidden';
window.__guardPassed = undefined; // undefined = en cours, true = OK, false = bloqué

(async () => {
  const pm  = localStorage.getItem('pm_auth') === '1';
  const sl  = localStorage.getItem('sl_auth') === '1';
  const tok = localStorage.getItem('sl_access_token');

  function showBlock(title, sub) {
    document.documentElement.style.visibility = 'visible';
    // Attendre que le body existe
    const render = () => {
      if (!document.body) { requestAnimationFrame(render); return; }
      document.body.innerHTML = `<div style="position:fixed;inset:0;background:#0f0f0d;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;text-align:center;padding:20px"><div><div style="font-size:48px;margin-bottom:16px">🚫</div><div style="font-family:'Fraunces',serif;font-size:22px;font-weight:900;color:#e8a045;margin-bottom:8px">${title}</div><div style="font-size:13px;color:#7a7a6e;margin-bottom:24px">${sub}</div><a href="hub.html" style="padding:14px 28px;background:#e8a045;border-radius:12px;font-family:'Fraunces',serif;font-size:16px;font-weight:700;color:#000;text-decoration:none">← Retour au hub</a></div></div>`;
    };
    render();
  }

  function allow() {
    window.__guardPassed = true;
    document.documentElement.style.visibility = 'visible';
  }

  // Pas connecté du tout
  if (!pm && !sl) {
    showBlock('Accès restreint', 'Connecte-toi depuis le hub');
    return;
  }

  // Connecté via Supabase → vérifier permission
  if (tok && sl) {
    const user = JSON.parse(localStorage.getItem('sl_user') || '{}');
    // Admin/superadmin → accès libre
    if (['superadmin','admin'].includes(user.role)) { allow(); return; }
    if (!user.id) { allow(); return; }
    try {
      const r = await fetch(
        'https://jeqptodorjzeyhapbmrz.supabase.co/rest/v1/permissions?user_id=eq.' + user.id + '&module=eq.produits&actif=eq.true&select=id',
        { headers: { 'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImplcXB0b2Rvcmp6ZXloYXBibXJ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NjI0ODksImV4cCI6MjA4OTIzODQ4OX0.j4JqeDnDMEghnBtKy5Knpb4QYDFEXiRtDeq7SSz3zWk', 'Authorization': 'Bearer ' + tok } }
      );
      const perms = await r.json();
      if (!Array.isArray(perms) || perms.length === 0) {
        showBlock('Module non activé', "Parle à Esteban pour obtenir l\'accès");
        return;
      }
      allow();
    } catch(e) { allow(); }
    return;
  }

  // PIN uniquement → accès libre
  allow();
})();
</script>

<style>
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  :root {
    --bg:#0f0f0d; --surface:#1a1a16; --border:#2e2e28;
    --text:#f0ede4; --muted:#7a7a6e; --amber:#e8a045;
    --red:#ff4040; --green:#4cdb8a; --yellow:#f5c842;
  }
  /* StoreLine theme */
  html[data-theme="light"] {
    --bg:#f7f3eb; --surface:#fffdf8; --surface2:#f0e8dc;
    --border:#e0d6c7; --border2:#c9bca9;
    --text:#211d18; --muted:#766b5f;
    --amber:#b96f22; --amber2:#d9913d;
    --red:#c93636; --red-bg:rgba(201,54,54,.10);
    --yellow:#b98916; --yellow-bg:rgba(185,137,22,.12);
    --green:#167a4a; --green-bg:rgba(22,122,74,.10);
    --blue:#1f75a8; --purple:#7c55c7;
    --grey:#8d8378; --grey-bg:rgba(141,131,120,.12);
  }
  body { transition:background .18s ease,color .18s ease; }
  .theme-toggle-global {
    position:fixed; top:12px; right:12px; z-index:1200;
    min-width:70px; height:34px; border-radius:999px; padding:0 12px;
    display:flex; align-items:center; justify-content:center;
    background:var(--surface); color:var(--amber);
    border:1px solid var(--border); box-shadow:0 10px 24px rgba(0,0,0,.18);
    font-size:11px;font-weight:700; cursor:pointer; line-height:1;
  }
  .theme-toggle-global:hover { border-color:var(--amber); color:var(--amber2); transform:translateY(-1px); }
  html[data-theme="light"] .theme-toggle-global { box-shadow:0 10px 24px rgba(84,62,37,.12); }
  @media(max-width:640px){ .theme-toggle-global { top:auto; right:12px; bottom:72px; } }

  body { background:var(--bg); color:var(--text); font-family:'DM Mono',monospace; min-height:100vh; }
  button { transition:all .15s; cursor:pointer; }
  button:active { transform:scale(0.97); }

  header {
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 24px; border-bottom:1px solid var(--border);
    position:sticky; top:0; background:var(--bg); z-index:100;
  }
  .logo-title { font-family:'Fraunces',serif; font-weight:900; font-size:20px; color:var(--amber); }
  .logo-sub   { font-size:10px; color:var(--muted); letter-spacing:2px; text-transform:uppercase; margin-top:2px; }
  .back-btn {
    padding:7px 14px; background:transparent; border:1px solid var(--border);
    border-radius:8px; color:var(--muted); font-family:'DM Mono',monospace;
    font-size:11px; text-decoration:none; display:flex; align-items:center; gap:6px;
  }
  .back-btn:hover { border-color:var(--amber); color:var(--text); }

  .main { padding:20px 24px 80px; max-width:700px; margin:0 auto; }

  .modal-overlay {
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.7);
    backdrop-filter:blur(4px); z-index:600;
    align-items:center; justify-content:center; padding:20px;
  }
  .modal {
    background:var(--surface); border:1px solid var(--border);
    border-radius:16px; padding:28px; width:100%; max-width:420px;
  }
  .modal-title { font-family:'Fraunces',serif; font-size:20px; font-weight:700; color:var(--amber); margin-bottom:20px; }
  .form-input {
    width:100%; padding:12px 16px; background:var(--bg);
    border:1px solid var(--border); border-radius:10px;
    color:var(--text); font-family:'DM Mono',monospace; font-size:14px;
    outline:none; margin-bottom:12px; transition:border-color .15s;
  }
  .form-input:focus { border-color:var(--amber); }
  .form-label { font-size:11px; color:var(--muted); letter-spacing:1px; text-transform:uppercase; margin-bottom:6px; display:block; }

  .toast-container { position:fixed; bottom:24px; right:24px; z-index:700; display:flex; flex-direction:column; gap:8px; }
  .toast {
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    padding:12px 18px; font-size:13px; animation:slideIn .2s ease; max-width:320px;
  }
  @keyframes slideIn { from{transform:translateX(100%);opacity:0} to{transform:none;opacity:1} }

  .version-tag { position:fixed; bottom:10px; left:14px; font-size:10px; color:var(--border); letter-spacing:1px; z-index:50; }
  .filter-btn {
    padding:6px 14px; border-radius:20px; border:1px solid var(--border);
    background:transparent; color:var(--muted); font-family:'DM Mono',monospace;
    font-size:11px; cursor:pointer; transition:all .15s; white-space:nowrap;
  }
  .filter-btn.active { background:var(--amber); color:#000; border-color:var(--amber); font-weight:600; }
  .filter-btn:hover { border-color:var(--amber); color:var(--text); }
  .theme-toggle-global, #theme-toggle { display:none !important; }
</style>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbz425iBOjYC8raof6W44y0IcJlCZHzjOrMzzjw0ju8uXFCKvFSl-xmYi9tZvOoSvP0aZg/exec";
const SUPABASE_URL  = 'https://jeqptodorjzeyhapbmrz.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImplcXB0b2Rvcmp6ZXloYXBibXJ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NjI0ODksImV4cCI6MjA4OTIzODQ4OX0.j4JqeDnDMEghnBtKy5Knpb4QYDFEXiRtDeq7SSz3zWk';
let sheetProducts = [];
let _apiCallId = 0;
let filtreMarque = '';
let triMode = 'nom';
let dataSource = 'apps';

function api(params) {
  return new Promise((resolve, reject) => {
    const cbName = 'dlcCb_' + (++_apiCallId);
    const script = document.createElement('script');
    const timer = setTimeout(() => { cleanup(); reject(new Error('Timeout')); }, 20000);
    window[cbName] = (data) => { cleanup(); resolve(data); };
    function cleanup() { clearTimeout(timer); delete window[cbName]; if (script.parentNode) script.remove(); }
    script.onerror = () => { cleanup(); reject(new Error('Erreur réseau')); };
    const p = new URLSearchParams({ ...params, callback: cbName });
    script.src = API_URL + '?' + p.toString();
    document.head.appendChild(script);
  });
}

function getStoredUser() {
  try { return JSON.parse(localStorage.getItem('sl_user') || '{}'); }
  catch(e) { return {}; }
}

function canUseSupabase() {
  return !!localStorage.getItem('sl_access_token');
}

async function sbRpcScalar(functionName, accessToken) {
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${functionName}`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON,
        'Authorization': `Bearer ${accessToken}`,
      },
      body: '{}',
    });
    if (!r.ok) return null;
    const text = await r.text();
    return text ? JSON.parse(text) : null;
  } catch(e) {
    return null;
  }
}

async function ensureSupabaseUserReady() {
  const token = localStorage.getItem('sl_access_token');
  let stored = getStoredUser();
  if (!token || stored.tenant_id) return stored;

  try {
    const authResp = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
      headers: { 'apikey': SUPABASE_ANON, 'Authorization': `Bearer ${token}` },
    });
    const authUser = authResp.ok ? await authResp.json() : {};
    let profile = null;
    const userId = authUser.id || stored.id;

    if (userId) {
      const profileResp = await fetch(`${SUPABASE_URL}/rest/v1/profiles?id=eq.${userId}&select=role,tenant_id`, {
        headers: { 'apikey': SUPABASE_ANON, 'Authorization': `Bearer ${token}` },
      });
      if (profileResp.ok) {
        const data = await profileResp.json();
        profile = Array.isArray(data) ? data[0] : null;
      }
    }

    if (!profile?.role || !profile?.tenant_id) {
      const [role, tenantId] = await Promise.all([
        sbRpcScalar('my_role', token),
        sbRpcScalar('my_tenant_id', token),
      ]);
      profile = {
        role: profile?.role || role || stored.role || 'employe',
        tenant_id: profile?.tenant_id || tenantId || null,
      };
    }

    stored = {
      id: userId || stored.id,
      email: authUser.email || stored.email,
      role: profile?.role || stored.role || 'employe',
      tenant_id: profile?.tenant_id || stored.tenant_id || null,
    };
    localStorage.setItem('sl_user', JSON.stringify(stored));
  } catch(e) {
    console.warn('[supabase] Session repair failed:', e.message);
  }

  return stored;
}

async function sbFetch(path, options={}) {
  const token = localStorage.getItem('sl_access_token');
  const r = await fetch(SUPABASE_URL + path, {
    ...options,
    headers: {
      'apikey': SUPABASE_ANON,
      'Authorization': `Bearer ${token}`,
      'Content-Type': 'application/json',
      'Prefer': 'return=representation',
      ...(options.headers || {})
    }
  });
  const text = await r.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch(e) { data = text; }
  if (!r.ok) throw new Error((data && (data.message || data.error)) || `Supabase ${r.status}`);
  return data;
}

async function loadProductsFromSupabase() {
  const user = await ensureSupabaseUserReady();
  if (!user.tenant_id) throw new Error('Tenant Supabase manquant');
  return await sbFetch(`/rest/v1/produits?tenant_id=eq.${encodeURIComponent(user.tenant_id)}&select=id,tenant_id,nom,marque,code_barres,categorie,created_at,updated_at&order=nom.asc`);
}

async function loadProductsFromAppsScript() {
  const d = await api({ action:'getProducts' });
  if (!d.success) throw new Error(d.error || 'Erreur Apps Script');
  return d.products || [];
}

async function refreshProducts() {
  if (canUseSupabase()) {
    try {
      const supaProducts = await loadProductsFromSupabase();
      dataSource = 'supabase';
      sheetProducts = Array.isArray(supaProducts) ? supaProducts : [];
      buildMarqueFilters();
      renderList();
      return;
    } catch(e) {
      console.warn('[produits] Supabase indisponible:', e.message);
      dataSource = 'supabase';
      sheetProducts = [];
      buildMarqueFilters();
      renderList();
      toast('Impossible de charger les produits Supabase', true);
      return;
    }
  }
  dataSource = 'apps';
  sheetProducts = await loadProductsFromAppsScript();
  buildMarqueFilters();
  renderList();
}

function toast(msg, isError = false) {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = 'toast';
  t.style.borderColor = isError ? 'var(--red)' : 'var(--green)';
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

function getProduitFields(p) {
  const keys = Object.keys(p);
  const nomKey    = keys.find(k => /nom_article|^nom$|^name$|article|designation|libelle/i.test(k));
  const marqueKey = keys.find(k => /patissier|marque|brand|fournisseur|fabricant/i.test(k));
  const barcodeKey= keys.find(k => /code_barres|barcode|ean|upc|^code$/i.test(k));
  const categorieKey = keys.find(k => /categorie|category|famille|rayon/i.test(k));
  return {
    nom:     (nomKey     ? String(p[nomKey]     || '') : '').trim(),
    marque:  (marqueKey  ? String(p[marqueKey]  || '') : '').trim(),
    barcode: (barcodeKey ? String(p[barcodeKey] || '') : '').trim(),
    categorie: (categorieKey ? String(p[categorieKey] || '') : '').trim(),
  };
}

function setTri(mode) {
  triMode = mode;
  renderList();
}

function setMarqueFilter(marque) {
  filtreMarque = marque;
  renderList();
}

function buildMarqueFilters() {
  const marques = [...new Set(sheetProducts.map(p => getProduitFields(p).marque).filter(Boolean))].sort();
  const sel = document.getElementById('marque-select');
  if (!sel) return;
  sel.innerHTML = '<option value="">Tous les fournisseurs</option>' +
    marques.map(m => `<option value="${m.replace(/"/g,'&quot;')}" ${filtreMarque===m?'selected':''}>${m}</option>`).join('');
}

function renderList() {
  const q = (document.getElementById('produits-search').value || '').toLowerCase().trim();
  let items = sheetProducts;
  if (filtreMarque) items = items.filter(p => getProduitFields(p).marque === filtreMarque);
  if (q) items = items.filter(p => { const f = getProduitFields(p); return f.nom.toLowerCase().includes(q) || f.marque.toLowerCase().includes(q) || f.barcode.includes(q); });

  const statsEl = document.getElementById('produits-stats');
  // Tri
  if (triMode === 'nom') items.sort((a,b) => { const fa=getProduitFields(a), fb=getProduitFields(b); return fa.nom.localeCompare(fb.nom, 'fr'); });
  else items.sort((a,b) => { const fa=getProduitFields(a), fb=getProduitFields(b); return fa.marque.localeCompare(fb.marque, 'fr') || fa.nom.localeCompare(fb.nom, 'fr'); });

  const filterInfo = filtreMarque ? ` · ${filtreMarque}` : '';
  const sourceInfo = dataSource === 'supabase' ? ' · Supabase' : ' · Sheets';
  statsEl.textContent = `${items.length} / ${sheetProducts.length} produit${sheetProducts.length !== 1 ? 's' : ''}${filterInfo}${sourceInfo}`;

  const list = document.getElementById('produits-list');
  if (!items.length) {
    list.innerHTML = `<div style="text-align:center;padding:60px 20px;color:var(--muted)">
      <div style="font-size:36px;margin-bottom:12px">📋</div>
      <div style="font-family:'Fraunces',serif;font-size:18px;margin-bottom:6px">${q ? 'Aucun résultat' : 'Base vide'}</div>
      <div style="font-size:12px">${q ? 'Essaie un autre terme' : 'Clique sur ＋ Nouveau pour ajouter'}</div></div>`;
    return;
  }
  list.innerHTML = items.map(p => {
    const { nom, marque, barcode, categorie } = getProduitFields(p);
    const sN = nom.replace(/'/g, "\\'"), sM = marque.replace(/'/g, "\\'");
    const idx = sheetProducts.indexOf(p);
    return `<div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px">
      <div style="flex:1;min-width:0">
        <div style="font-family:'Fraunces',serif;font-size:11px;font-weight:700;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${nom || '<span style="color:var(--muted);font-style:italic">Sans nom</span>'}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:2px">${marque}${barcode ? ' · ' + barcode : ''}${categorie ? ' · ' + categorie : ''}</div>
      </div>
      <button onclick="openEditModal(${idx})"
        style="flex-shrink:0;padding:7px 10px;background:transparent;border:1px solid rgba(232,160,69,.35);border-radius:7px;font-size:14px;color:var(--amber);"><span class=ic-edit></span></button>
      <button onclick="deleteProduct('${sN}','${sM}',${idx})"
        style="flex-shrink:0;padding:7px 10px;background:transparent;border:1px solid rgba(255,64,64,.3);border-radius:7px;font-size:14px;color:var(--red);"><span class=ic-del></span></button>
    </div>`;
  }).join('');
}

// ── Edition ──
function openEditModal(index) {
  const p = sheetProducts[index];
  if (!p) { toast('⚠ Produit introuvable', true); return; }
  const f = getProduitFields(p);
  document.getElementById('edit-index').value = index;
  document.getElementById('edit-old-nom').value = f.nom;
  document.getElementById('edit-old-marque').value = f.marque;
  document.getElementById('edit-old-barcode').value = f.barcode;
  document.getElementById('edit-nom').value = f.nom;
  document.getElementById('edit-marque').value = f.marque;
  document.getElementById('edit-barcode').value = f.barcode;
  document.getElementById('edit-categorie').value = f.categorie;
  document.getElementById('modal-edit').style.display = 'flex';
  setTimeout(() => document.getElementById('edit-nom').focus(), 100);
}

function closeEditModal() { document.getElementById('modal-edit').style.display = 'none'; }

async function saveProductEdit() {
  const index = parseInt(document.getElementById('edit-index').value, 10);
  const current = sheetProducts[index];
  const nom = document.getElementById('edit-nom').value.trim();
  const marque = document.getElementById('edit-marque').value.trim();
  const barcode = document.getElementById('edit-barcode').value.trim();
  const categorie = document.getElementById('edit-categorie').value.trim();
  const oldName = document.getElementById('edit-old-nom').value;
  const oldBrand = document.getElementById('edit-old-marque').value;
  const oldBarcode = document.getElementById('edit-old-barcode').value;

  if (!nom) { toast('⚠ Le nom est obligatoire', true); return; }
  closeEditModal();
  toast(`⏳ Mise à jour de "${nom}"…`);
  if (dataSource === 'supabase' && current && current.id) {
    try {
      await sbFetch(`/rest/v1/produits?id=eq.${encodeURIComponent(current.id)}`, {
        method: 'PATCH',
        body: JSON.stringify({ nom, marque, code_barres: barcode || null, categorie: categorie || null })
      });
      toast(`✓ "${nom}" modifié`);
      await refreshProducts();
    } catch(e) {
      toast(`⚠ ${e.message}`, true);
    }
    return;
  }
  try {
    const data = await api({
      action:'updateProduct',
      oldName, oldBrand, oldBarcode,
      name:nom, brand:marque, barcode, categorie
    });
    if (data && data.success) {
      toast(`✓ "${nom}" modifié`);
      const d2 = await api({ action:'getProducts' });
      if (d2.success) {
        sheetProducts = d2.products;
        buildMarqueFilters();
        renderList();
      } else if (sheetProducts[index]) {
        sheetProducts[index] = { ...sheetProducts[index], nom_article:nom, patissier:marque, code_barres:barcode, categorie };
        buildMarqueFilters();
        renderList();
      }
    } else {
      toast(`⚠ ${data?.error || 'Mets à jour le Apps Script (action updateProduct)'}`, true);
    }
  } catch(e) {
    toast('⚠ Erreur réseau', true);
  }
}

// ── Ajout ──
function openAddModal() {
  ['add-nom','add-marque','add-barcode'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('add-categorie').value = 'Rayon frais';
  document.getElementById('modal-add').style.display = 'flex';
  setTimeout(() => document.getElementById('add-nom').focus(), 100);
}
function closeAddModal() { document.getElementById('modal-add').style.display = 'none'; }

async function addProduct() {
  const nom    = document.getElementById('add-nom').value.trim();
  const marque = document.getElementById('add-marque').value.trim();
  const barcode= document.getElementById('add-barcode').value.trim();
  const categorie = document.getElementById('add-categorie').value.trim();
  if (!nom) { toast('⚠ Le nom est obligatoire', true); return; }
  toast('⏳ Enregistrement…');
  closeAddModal();
  if (dataSource === 'supabase' && canUseSupabase()) {
    const user = getStoredUser();
    try {
      await sbFetch('/rest/v1/produits', {
        method: 'POST',
        body: JSON.stringify({
          tenant_id: user.tenant_id,
          nom,
          marque,
          code_barres: barcode || null,
          categorie: categorie || null,
          created_by: user.id || null
        })
      });
      toast(`✓ "${nom}" ajouté à la base`);
      await refreshProducts();
    } catch(e) {
      toast(`⚠ ${e.message}`, true);
    }
    return;
  }
  try {
    const data = await api({ action:'addProduct', name:nom, brand:marque, barcode, categorie });
    if (data && data.success) {
      toast(`✓ "${nom}" ajouté à la base`);
      const d2 = await api({ action:'getProducts' });
      if (d2.success) { sheetProducts = d2.products; renderList(); }
    } else {
      toast(`⚠ ${data?.error || 'Erreur Apps Script'}`, true);
    }
  } catch(e) { toast('⚠ Erreur réseau', true); }
}

// ── Suppression ──
let _confirmCb = null;
function askConfirm(msg, cb) {
  _confirmCb = cb;
  document.getElementById('confirm-msg').textContent = msg;
  document.getElementById('confirm-btn').onclick = () => { closeConfirm(); cb(); };
  document.getElementById('modal-confirm').style.display = 'flex';
}
function closeConfirm() { document.getElementById('modal-confirm').style.display = 'none'; }

async function deleteProduct(nom, marque, index) {
  askConfirm(`Supprimer "${nom}" de la base produits ?`, async () => {
    toast(`⏳ Suppression de "${nom}"…`);
    const current = sheetProducts[index];
    if (dataSource === 'supabase' && current && current.id) {
      try {
        await sbFetch(`/rest/v1/produits?id=eq.${encodeURIComponent(current.id)}`, { method:'DELETE' });
        await refreshProducts();
        toast(`✓ "${nom}" supprimé`);
      } catch(e) {
        toast(`⚠ ${e.message}`, true);
      }
      return;
    }
    try {
      const data = await api({ action:'deleteProduct', name:nom, brand:marque });
      if (data && data.success) {
        sheetProducts = sheetProducts.filter(p => {
          const f = getProduitFields(p);
          return !(f.nom.toLowerCase() === nom.toLowerCase() && f.marque.toLowerCase() === marque.toLowerCase());
        });
        renderList();
        toast(`✓ "${nom}" supprimé`);
      } else {
        toast(`⚠ ${data?.error || 'Erreur Apps Script'}`, true);
      }
    } catch(e) { toast('⚠ Erreur réseau', true); }
  });
}

// ── Init ──
async function init() {
  document.getElementById('produits-list').innerHTML = '<div style="text-align:center;padding:40px;color:var(--muted)">⏳ Chargement…</div>';
  try {
    await refreshProducts();
  } catch(e) {
    document.getElementById('produits-list').innerHTML = '<div style="text-align:center;padding:40px;color:var(--red)">⚠ Hors ligne</div>';
  }
}
// Attendre que le guard soit résolu ET que le DOM soit prêt
function _runWhenReady() {
  if (window.__guardPassed === true) {
    init();
  } else if (window.__guardPassed === false) {
    // Bloqué — ne rien faire
  } else {
    // Guard encore en cours — réessayer
    setTimeout(_runWhenReady, 50);
  }
}
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', _runWhenReady);
} else {
  _runWhenReady();
}

// ── Scanner produit ──
let _produitScanner = null;

async function openProduitScanner() {
  const wrap = document.getElementById('produit-scanner-wrap');
  wrap.style.display = 'block';
  wrap.innerHTML = '';
  // Attendre que Html5Qrcode soit disponible (chargé statiquement)
  let tries = 0;
  while (!window.Html5Qrcode && tries < 20) {
    await new Promise(r => setTimeout(r, 200));
    tries++;
  }
  if (!window.Html5Qrcode) { toast('⚠ Scanner non disponible', true); wrap.style.display='none'; return; }
  try {
    _produitScanner = new Html5Qrcode('produit-scanner-wrap');
    await _produitScanner.start(
      { facingMode: 'environment' },
      { fps: 15, qrbox: { width: 250, height: 120 },
        formatsToSupport: [
          Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.UPC_A
        ]
      },
      (code) => {
        closeProduitScanner();
        document.getElementById('add-barcode').value = code;
        toast('📷 Code scanné : ' + code);
      },
      () => {}
    );
  } catch(e) {
    wrap.style.display = 'none';
    toast('⚠ ' + e, true);
  }
}

async function closeProduitScanner() {
  const wrap = document.getElementById('produit-scanner-wrap');
  if (_produitScanner) {
    try { if (_produitScanner.isScanning) await _produitScanner.stop(); _produitScanner.clear(); } catch(e) {}
    _produitScanner = null;
  }
  if (wrap) wrap.style.display = 'none';
}

// Fermer le scanner quand on ferme le modal — patch non récursif
const _closeAddModal_orig = window.closeAddModal || function(){};
window.closeAddModal = function() {
  closeProduitScanner();
  document.getElementById('modal-add').style.display = 'none';
};
