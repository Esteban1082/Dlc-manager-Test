<script id="sl-helpers">
// StoreLine — utilitaires communs : échappement HTML, recherche sans accents, messages d'erreur lisibles
window.esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
window.norm = function (s) { return String(s == null ? '' : s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim(); };
window.localISO = function (d) { d = d ? new Date(d) : new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
window.slFetch = function (url, opts) {
  return fetch(url, opts).catch(function () { throw new Error('Pas de connexion. Réessaie dans un instant.'); });
};
window.slErrMsg = function (status, data) {
  var code = data && data.code, msg = String((data && (data.message || data.error_description || data.error)) || '');
  if (code === '23505') {
    if (/code_barres|barcode/i.test(msg)) return 'Ce code-barres est déjà utilisé';
    return 'Cet élément existe déjà';
  }
  if (code === '23503') return 'Élément encore utilisé ailleurs : action impossible';
  if (code === '42501' || status === 403) return "Tu n'as pas les droits pour cette action";
  if (status === 401 || /jwt/i.test(msg)) return 'Session expirée, reconnecte-toi';
  if (code === '22P02' || code === '23502' || code === '23514' || code === '22007' || code === '22008') return 'Donnée invalide, vérifie les champs';
  if (status >= 500) return 'Le serveur ne répond pas, réessaie dans un instant';
  return msg || ('Erreur ' + status);
};
// Page restée ouverte (tablette en magasin) : on recharge au changement de jour pour que « aujourd'hui » reste juste
(function () {
  if (/login|set-password/.test(location.pathname)) return;
  var day = window.localISO();
  function check() { if (document.visibilityState === 'visible' && window.localISO() !== day) location.reload(); }
  document.addEventListener('visibilitychange', check);
  setInterval(check, 5 * 60 * 1000);
})();
</script>

(function () {
  var U = 'https://jeqptodorjzeyhapbmrz.supabase.co';
  var K = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImplcXB0b2Rvcmp6ZXloYXBibXJ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NjI0ODksImV4cCI6MjA4OTIzODQ4OX0.j4JqeDnDMEghnBtKy5Knpb4QYDFEXiRtDeq7SSz3zWk';
  var busy = null;
  function exp(t) { try { return JSON.parse(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).exp * 1000; } catch (e) { return 0; } }
  function logoutExpired() {
    ['sl_access_token', 'sl_refresh_token', 'sl_auth', 'sl_user'].forEach(function (k) { localStorage.removeItem(k); });
    location.replace('login.html?expired=1');
  }
  function refresh() {
    if (busy) return busy;
    var rt = localStorage.getItem('sl_refresh_token');
    if (!rt) return Promise.resolve(false);
    busy = fetch(U + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'apikey': K }, body: JSON.stringify({ refresh_token: rt })
    }).then(function (r) {
      if (r.status === 400 || r.status === 401 || r.status === 403) { logoutExpired(); return false; }
      if (!r.ok) return false;
      return r.json().then(function (d) {
        localStorage.setItem('sl_access_token', d.access_token);
        if (d.refresh_token) localStorage.setItem('sl_refresh_token', d.refresh_token);
        return true;
      });
    }).catch(function () { return false; }).then(function (v) { busy = null; return v; });
    return busy;
  }
  window.slEnsureSession = function () {
    var t = localStorage.getItem('sl_access_token');
    if (!t) return Promise.resolve(false);
    return exp(t) - Date.now() < 5 * 60 * 1000 ? refresh() : Promise.resolve(true);
  };
  window.slSessionReady = window.slEnsureSession();
  setInterval(window.slEnsureSession, 4 * 60 * 1000);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') window.slEnsureSession(); });
})();
</script>

<meta http-equiv="Content-Security-Policy" content="default-src * blob: data:; script-src * 'unsafe-inline' 'unsafe-eval' blob:; style-src * 'unsafe-inline'; connect-src *; img-src * blob: data:; worker-src * blob:; media-src * blob:;">
<script>
// Guard — bloque l'accès si pas de permission
document.documentElement.style.visibility = 'hidden';
window.__guardPassed = undefined; // undefined = en cours, true = OK, false = bloqué

(async () => {
  if (window.slSessionReady) await window.slSessionReady;
  const sl  = localStorage.getItem('sl_auth') === '1';
  const tok = localStorage.getItem('sl_access_token');

  function showBlock(title, sub) {
    document.documentElement.style.visibility = 'visible';
    // Attendre que le body existe
    const render = () => {
      if (!document.body) { requestAnimationFrame(render); return; }
      document.body.innerHTML = `<div style="position:fixed;inset:0;background:#f4efe7;color:#23201c;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;text-align:center;padding:24px"><div style="max-width:320px"><div style="font-family:'Fraunces',Georgia,serif;font-size:28px;font-weight:700;margin-bottom:8px">${title}</div><div style="font-size:15px;color:#6e6256;margin-bottom:28px;line-height:1.4">${sub}</div><a href="hub.html" style="display:inline-block;padding:14px 28px;background:#e8a045;border-radius:999px;font-size:16px;font-weight:700;color:#23201c;text-decoration:none">Retour à l’accueil</a></div></div>`;
    };
    render();
  }

  function allow() {
    window.__guardPassed = true;
    document.documentElement.style.visibility = 'visible';
  }

  // Pas connecté avec un compte → page de connexion
  if (!tok || !sl) { window.location.replace('login.html'); return; }

  // Connecté via Supabase → vérifier permission
  if (tok && sl) {
    const user = JSON.parse(localStorage.getItem('sl_user') || '{}');
    // Admin/superadmin → accès libre
    if (['superadmin','admin'].includes(user.role)) { allow(); return; }
    if (!user.id) { allow(); return; }
    try {
      const r = await fetch(
        'https://jeqptodorjzeyhapbmrz.supabase.co/rest/v1/permissions?user_id=eq.' + user.id + '&module=eq.temperatures&actif=eq.true&select=id',
        { headers: { 'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImplcXB0b2Rvcmp6ZXloYXBibXJ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NjI0ODksImV4cCI6MjA4OTIzODQ4OX0.j4JqeDnDMEghnBtKy5Knpb4QYDFEXiRtDeq7SSz3zWk', 'Authorization': 'Bearer ' + tok } }
      );
      const perms = await r.json();
      if (!Array.isArray(perms) || perms.length === 0) {
        showBlock('Module non activé', "Demande l\'accès à ton responsable");
        return;
      }
      allow();
    } catch(e) { allow(); }
    return;
  }

})();
</script>

    zone_nom: zone.nom,
    valeur: val,
    date_releve: day,
    heure,
    hors_norme: val < zone.min || val > zone.max,
    created_by: user.id || null
  }));
  try {
    const saved = await sbFetch('/rest/v1/temperatures', { method:'POST', body: JSON.stringify(rows) });
    const nbHors = rows.filter(r => r.hors_norme).length;
    zones.forEach(a => {
      const inp = document.getElementById('temp-' + a.id);
      if (inp) inp.value = '';
      const card = document.getElementById('card-' + a.id); if (card) card.className = 'appliance-card';
      const st = document.getElementById('status-' + a.id); if (st) st.textContent = '';
    });
    await loadHisto();
    // Hors norme : on demande tout de suite l'action corrective (trace exigée par l'autocontrôle)
    const hors = (Array.isArray(saved) ? saved : []).filter(r => r.hors_norme);
    const askAction = hors.length && hasActionCols;
    // Le toast couvrirait les boutons de la fenêtre d'action : on ne l'affiche que s'il n'y en a pas
    if (!askAction) toast(`Relevé enregistré : ${entries.length} appareil${entries.length > 1 ? 's' : ''}${nbHors ? ` · ${nbHors} hors norme` : ''}`, nbHors > 0);
    if (askAction) openActionFor(hors.map(r => ({ id: r.id, nom: r.zone_nom, val: r.valeur, zone: zones.find(z => z.id === r.zone_id || z.nom === r.zone_nom) })));
  } catch(e) {
    toast(e.message, true);
  }
}

// ── Action corrective ──
function openActionFor(items) {
  actionQueue = items.slice();
  showNextAction();
}
function showNextAction() {
  const it = actionQueue[0];
  if (!it) { closeActionModal(); return; }
  actionSel = new Set();
  const plage = it.zone ? ` (attendu ${it.zone.min} à ${it.zone.max} °C)` : '';
  document.getElementById('action-intro').innerHTML = `<b style="color:var(--red)">${esc(it.nom)} : ${esc(String(it.val).replace('.', ','))} °C</b>${esc(plage)}${actionQueue.length > 1 ? ` · encore ${actionQueue.length - 1} après` : ''}`;
  document.getElementById('action-quick').innerHTML = ACTIONS.map((a, i) => `<button type="button" class="act-btn" data-i="${i}" onclick="toggleAct(${i}, this)">${esc(a)}</button>`).join('');
  document.getElementById('action-text').value = '';
  document.getElementById('modal-action').style.display = 'flex';
}
function toggleAct(i, btn) { if (actionSel.has(i)) actionSel.delete(i); else actionSel.add(i); btn.classList.toggle('on', actionSel.has(i)); }
function closeActionModal() { actionQueue = []; document.getElementById('modal-action').style.display = 'none'; }
async function saveAction() {
  const it = actionQueue[0]; if (!it) return;
  const txt = [...actionSel].sort().map(i => ACTIONS[i]).concat(document.getElementById('action-text').value.trim() ? [document.getElementById('action-text').value.trim()] : []).join(' · ');
  if (!txt) { toast('Choisis ou écris l’action réalisée', true); return; }
  const me = getStoredUser();
  try {
    await sbFetch(`/rest/v1/temperatures?id=eq.${encodeURIComponent(it.id)}`, { method: 'PATCH', body: JSON.stringify({ action_corrective: txt, action_par: me.email || null, action_le: new Date().toISOString() }) });
    actionQueue.shift();
    toast('Action enregistrée');
    await loadHisto();
    showNextAction();
  } catch (e) { toast(e.message, true); }
}
function actionForRow(rowId) {
  const h = histoData.find(x => x.rowId === rowId); if (!h) return;
  openActionFor([{ id: rowId, nom: h.nom, val: h.temp, zone: zones.find(z => z.id === h.id || z.nom === h.nom) }]);
}

// ── Historique ──
function setHistoFilter(f, btn) {
  histoFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.style.background = 'transparent'; b.style.color = 'var(--muted)'; b.style.borderColor = 'var(--border)'; b.classList.remove('active');
  });
  btn.style.background = 'var(--amber)'; btn.style.color = '#000'; btn.style.borderColor = 'var(--amber)'; btn.classList.add('active');
  renderHisto();
}

async function loadHisto() {
  if (canUseSupabase()) {
    const user = await ensureSupabaseUserReady();
    try {
      if (!user.tenant_id) throw new Error('Tenant Supabase manquant');
      const base = `/rest/v1/temperatures?tenant_id=eq.${encodeURIComponent(user.tenant_id)}&order=date_releve.desc,created_at.desc&select=id,zone_id,zone_nom,valeur,date_releve,heure,hors_norme,created_at`;
      let rows;
      try { rows = await sbFetch(base + (hasActionCols ? ',action_corrective,action_par' : '')); }
      catch (e) { if (!hasActionCols || !/action_/.test(e.message)) throw e; hasActionCols = false; rows = await sbFetch(base); }
      dataSource = 'supabase';
      histoData = (Array.isArray(rows) ? rows : []).map(normalizeTempRow);
      renderHisto();
      return;
    } catch(e) {
      console.warn('[temperatures] Supabase indisponible:', e.message);
      dataSource = 'supabase';
      histoData = [];
      renderHisto();
      toast('Impossible de charger les relevés', true);
      return;
    }
  }
}

function renderHisto() {
  const now = new Date(); now.setHours(0,0,0,0);
  const today = localISO();
  const todays = histoData.filter(h => h.date === today && h.heure).map(h => h.heure.slice(0,5)).sort();
  const lbl = document.getElementById('today-label');
  if (lbl) lbl.textContent = new Date().toLocaleDateString('fr-BE', { weekday:'long', day:'numeric', month:'long', year:'numeric' })
    + (todays.length ? ` · relevé fait à ${todays[todays.length - 1]}` : ' · pas encore de relevé');

  const filtered = histoData.filter(h => {
    if (!h.date) return true;
    const d = new Date(h.date + 'T00:00:00');
    if (histoFilter === 'semaine') { const w = new Date(now); w.setDate(now.getDate()-7); return d >= w; }
    if (histoFilter === 'mois')    { const m = new Date(now); m.setDate(now.getDate()-30); return d >= m; }
    return true;
  }).sort((a,b) => (b.date||'').localeCompare(a.date||'') || (b.heure||'').localeCompare(a.heure||''));

  const list = document.getElementById('histo-list');
  if (!filtered.length) {
    list.innerHTML = `<div style="text-align:center;padding:40px;color:var(--muted)">Aucun relevé dans cette période</div>`;
    return;
  }
  // Hors norme : on se fie à ce qui a été enregistré au moment du relevé (les plages ont pu changer depuis)
  const isHors = h => {
    if (h.horsNorme !== null) return h.horsNorme;
    const a = zones.find(x => x.id === h.id || x.nom === h.nom);
    const v = parseFloat(h.temp);
    return !!a && !isNaN(v) && (v < a.min || v > a.max);
  };
  const byDate = {};
  filtered.forEach(h => { const k = h.date||'?'; if (!byDate[k]) byDate[k]=[]; byDate[k].push(h); });
  let html = '';
  for (const [dateKey, items] of Object.entries(byDate)) {
    const label = dateKey === '?' ? 'Date inconnue' : new Date(dateKey+'T00:00:00').toLocaleDateString('fr-BE', {weekday:'short', day:'numeric', month:'short'});
    const nbWarn = items.filter(isHors).length;
    html += `<div style="font-size:11px;color:${nbWarn?'var(--red)':'var(--muted)'};letter-spacing:2px;text-transform:uppercase;margin:16px 0 8px;display:flex;align-items:center;gap:8px">
      ${esc(label)}${nbWarn ? ` · ${nbWarn} hors norme` : ''}
      <span style="flex:1;height:1px;background:var(--border);display:block"></span>
    </div>`;
    html += items.map(h => {
      const a = zones.find(x => x.id === h.id || x.nom === h.nom);
      const v = parseFloat(h.temp);
      const ok = !isHors(h);
      return `<div class="histo-row" style="border-color:${ok?'var(--border)':'rgba(255,64,64,.3)'}">
        <div>
          <span style="font-weight:600">${esc(h.nom || h.id)}</span>
          <span style="font-size:11px;color:var(--muted);margin-left:8px">${esc((h.heure||'').slice(0,5))}${a ? ` · ${a.min}→${a.max}°C` : ''}</span>
        </div>
        <div style="font-family:'Fraunces',serif;font-size:20px;font-weight:700;color:${ok?'var(--text)':'var(--red)'}">
          ${isNaN(v) ? '—' : String(v).replace('.', ',') + '°C'}
        </div>
      </div>${ok ? '' : (h.action
        ? `<div style="margin:-4px 0 8px;padding:8px 12px;border-radius:10px;background:var(--surface2);font-size:12px;color:var(--muted)"><b style="color:var(--text)">Action :</b> ${esc(h.action)}${h.actionPar ? ` · ${esc(h.actionPar)}` : ''}</div>`
        : (hasActionCols && h.rowId ? `<div style="margin:-4px 0 8px"><button type="button" class="act-btn" style="color:var(--red)" onclick="actionForRow('${esc(h.rowId)}')">Noter l’action corrective</button></div>` : ''))}`;
    }).join('');
  }
  list.innerHTML = html;
}

// ── Gestion appareils ──
function openZoneModal() {
  renderZonesManage();
  document.getElementById('new-zone-name').value = '';
  document.getElementById('new-zone-min').value = '';
  document.getElementById('new-zone-max').value = '';
  document.getElementById('modal-zones').style.display = 'flex';
}
function closeZoneModal() { document.getElementById('modal-zones').style.display = 'none'; }

function renderZonesManage() {
  document.getElementById('zones-manage-list').innerHTML = zones.length
    ? zones.map((a, i) => `
      <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--bg);border-radius:8px;margin-bottom:6px">
        <div>
          <span style="font-size:13px;font-weight:600">${esc(a.nom)}</span>
          <span style="font-size:11px;color:var(--muted);margin-left:8px">${a.min}°C → ${a.max}°C</span>
        </div>
        <button onclick="removeZone(zones[${i}].id)" aria-label="Retirer cette zone" style="padding:4px 10px;background:transparent;border:1px solid rgba(255,64,64,.3);border-radius:6px;font-size:12px;color:var(--red);"><span class=ic-del></span></button>
      </div>`).join('')
    : '<div style="color:var(--muted);font-size:12px;margin-bottom:8px">Aucune zone configurée.</div>';
}

function addZone() {
  const nom = document.getElementById('new-zone-name').value.trim();
  const min = parseFloat(document.getElementById('new-zone-min').value);
  const max = parseFloat(document.getElementById('new-zone-max').value);
  if (!nom) { toast('Le nom est obligatoire', true); return; }
  if (!isNaN(min) && !isNaN(max) && min > max) { toast('Le minimum doit être inférieur au maximum', true); return; }
  const id = 'app_' + Date.now();
  const newZone = { id, nom, min: isNaN(min) ? -99 : min, max: isNaN(max) ? 99 : max };
  if (canUseSupabase() && zonesSource === 'supabase') {
    const user = getStoredUser();
    sbFetch('/rest/v1/zones', {
      method: 'POST',
      body: JSON.stringify({
        tenant_id: user.tenant_id,
        nom,
        temp_min: newZone.min,
        temp_max: newZone.max,
        ordre: zones.length,
        actif: true
      })
    }).then(loadZones).then(() => {
      renderAppareils();
      renderZonesManage();
      document.getElementById('new-zone-name').value = '';
      toast(`"${nom}" ajouté`);
    }).catch(e => toast(`${e.message}`, true));
    return;
  }
  zones.push(newZone);
  if (zonesSource !== 'supabase') saveZonesLocal();
  renderAppareils();
  renderZonesManage();
  document.getElementById('new-zone-name').value = '';
  toast(`"${nom}" ajouté`);
}

function removeZone(id) {
  if (canUseSupabase() && zonesSource === 'supabase' && /^[0-9a-f-]{36}$/i.test(String(id))) {
    sbFetch(`/rest/v1/zones?id=eq.${encodeURIComponent(id)}`, {
      method: 'PATCH',
      body: JSON.stringify({ actif:false })
    }).then(loadZones).then(() => {
      renderAppareils();
      renderZonesManage();
    }).catch(e => toast(`${e.message}`, true));
    return;
  }
  zones = zones.filter(a => a.id !== id);
  saveZonesLocal();
  renderAppareils();
  renderZonesManage();
}

function saveZonesLocal() {
  try { localStorage.setItem('pm_zones', JSON.stringify(zones)); } catch(e) {}
}
function loadZonesLocal() {
  try {
    const saved = localStorage.getItem('pm_zones');
    if (saved) zones = JSON.parse(saved);
  } catch(e) {}
}

loadZonesLocal();
// Attendre que le guard soit résolu ET que le DOM soit prêt
function _runWhenReady() {
  if (window.__guardPassed === true) {
    init();
  } else if (window.__guardPassed === false) {
    // Bloqué — ne rien faire
  } else {
    // Guard encore en cours — réessayer
    setTimeout(_runWhenReady, 50);
  }
}
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', _runWhenReady);
} else {
  _runWhenReady();
}
</script>
</body>
</html>
