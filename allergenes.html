<!DOCTYPE html>
<html lang="fr">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src * blob: data:; script-src * 'unsafe-inline' 'unsafe-eval' blob:; style-src * 'unsafe-inline'; connect-src *; img-src * blob: data:; worker-src * blob:; media-src * blob:;">
<script>
// Guard — bloque l'accès si pas de permission
document.documentElement.style.visibility = 'hidden';
window.__guardPassed = undefined; // undefined = en cours, true = OK, false = bloqué

(async () => {
  const sl  = localStorage.getItem('sl_auth') === '1';
  const tok = localStorage.getItem('sl_access_token');

  function showBlock(title, sub) {
    document.documentElement.style.visibility = 'visible';
    // Attendre que le body existe
    const render = () => {
      if (!document.body) { requestAnimationFrame(render); return; }
      document.body.innerHTML = `<div style="position:fixed;inset:0;background:#f4efe7;color:#23201c;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;text-align:center;padding:24px"><div style="max-width:320px"><div style="font-family:'Fraunces',Georgia,serif;font-size:28px;font-weight:700;margin-bottom:8px">${title}</div><div style="font-size:15px;color:#6e6256;margin-bottom:28px;line-height:1.4">${sub}</div><a href="hub.html" style="display:inline-block;padding:14px 28px;background:#e8a045;border-radius:999px;font-size:16px;font-weight:700;color:#23201c;text-decoration:none">Retour à l’accueil</a></div></div>`;
    };
    render();
  }

  function allow() {
    window.__guardPassed = true;
    document.documentElement.style.visibility = 'visible';
  }

  // Pas connecté avec un compte → page de connexion
  if (!tok || !sl) { window.location.replace('login.html'); return; }

  // Connecté via Supabase → vérifier permission
  if (tok && sl) {
    const user = JSON.parse(localStorage.getItem('sl_user') || '{}');
    // Admin/superadmin → accès libre
    if (['superadmin','admin'].includes(user.role)) { allow(); return; }
    if (!user.id) { allow(); return; }
    try {
      const r = await fetch(
        'https://jeqptodorjzeyhapbmrz.supabase.co/rest/v1/permissions?user_id=eq.' + user.id + '&module=eq.allergenes&actif=eq.true&select=id',
        { headers: { 'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImplcXB0b2Rvcmp6ZXloYXBibXJ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NjI0ODksImV4cCI6MjA4OTIzODQ4OX0.j4JqeDnDMEghnBtKy5Knpb4QYDFEXiRtDeq7SSz3zWk', 'Authorization': 'Bearer ' + tok } }
      );
      const perms = await r.json();
      if (!Array.isArray(perms) || perms.length === 0) {
        showBlock('Module non activé', "Demande l\'accès à ton responsable");
        return;
      }
      allow();
    } catch(e) { allow(); }
    return;
  }

})();
</script>

<style>
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }

  html[data-theme="light"] .theme-toggle-global { box-shadow:0 10px 24px rgba(84,62,37,.12); }
  @media(max-width:640px){ .theme-toggle-global { top:auto; right:12px; bottom:72px; } }

  body { background:var(--bg); color:var(--text); font-family:'DM Mono',monospace; min-height:100vh; }
  button { transition:all .15s; cursor:pointer; }

  header {

  .back-btn {
    padding:7px 14px; background:transparent; border:1px solid var(--border);

  }

  .main { padding:20px 24px 80px; max-width:800px; margin:0 auto; }

  /* Chips 3 états dans le modal */
  .a-chip {
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 14px; border-radius:10px; border:2px solid var(--border);

    padding:6px 12px; font-size:12px; font-weight:700;

    color:var(--muted); transition:all .15s;
  }

  .a-chip-toggle button.sel-non  { background:rgba(255,64,64,.15);   color:var(--red); }
  .a-chip-toggle button.sel-inconnu { background:rgba(245,200,66,.15); color:var(--yellow); }

  /* Badges dans la liste */
  .badge-oui { display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:6px;font-size:11px;background:rgba(255,64,64,.12);border:1px solid rgba(255,64,64,.3);color:var(--red);margin:2px }

  .badge-inconnu { display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:6px;font-size:11px;background:rgba(245,200,66,.10);border:1px solid rgba(245,200,66,.25);color:var(--yellow);margin:2px }

  .product-card {
    background:var(--surface); border:1px solid var(--border);
    border-radius:12px; padding:16px; margin-bottom:10px;
  }

  .modal-overlay {
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.8);
    backdrop-filter:blur(4px); z-index:600;
    align-items:flex-end; justify-content:center;
  }
  .modal {
    background:var(--surface); border:1px solid var(--border);
    border-radius:20px 20px 0 0; padding:24px; width:100%; max-width:500px;
    max-height:90vh; overflow-y:auto;
  }
  .modal-title { font-family:'Fraunces',serif; font-size:18px; font-weight:700; color:var(--amber); margin-bottom:6px; }
  .form-input {
    width:100%; padding:12px 16px; background:var(--bg);
    border:1px solid var(--border); border-radius:10px;

  .filter-chip {
    display:inline-flex; align-items:center; gap:6px;
    padding:7px 14px; border-radius:20px; font-size:12px;
    border:2px solid var(--border); background:var(--surface);

  .mode-btn {

  .toast-container { position:fixed; bottom:24px; right:24px; z-index:700; display:flex; flex-direction:column; gap:8px; }
  .toast { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px 18px; font-size:13px; animation:slideIn .2s ease; max-width:300px; }
  @keyframes slideIn { from{transform:translateX(100%);opacity:0} to{transform:none;opacity:1} }
  .version-tag { position:fixed; bottom:10px; left:14px; font-size:10px; color:var(--border); letter-spacing:1px; z-index:50; }
  .theme-toggle-global, #theme-toggle { display:none !important; }
</style>

<script>
const SUPABASE_URL  = 'https://jeqptodorjzeyhapbmrz.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImplcXB0b2Rvcmp6ZXloYXBibXJ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NjI0ODksImV4cCI6MjA4OTIzODQ4OX0.j4JqeDnDMEghnBtKy5Knpb4QYDFEXiRtDeq7SSz3zWk';

// Les 14 allergènes réglementaires EU
const ALLERGENS = [
  { id:'gluten',     label:'Gluten',          emoji:'🌾' },
  { id:'crustaces',  label:'Crustacés',        emoji:'🦐' },
  { id:'oeufs',      label:'Œufs',             emoji:'🥚' },
  { id:'poissons',   label:'Poissons',         emoji:'🐟' },
  { id:'arachides',  label:'Arachides',        emoji:'🥜' },
  { id:'soja',       label:'Soja',             emoji:'🫘' },
  { id:'lait',       label:'Lait',             emoji:'🥛' },
  { id:'fruits_coq', label:'Fruits à coque',   emoji:'🌰' },
  { id:'celeri',     label:'Céleri',           emoji:'🌿' },
  { id:'moutarde',   label:'Moutarde',         emoji:'🌻' },
  { id:'sesame',     label:'Sésame',           emoji:'🌱' },
  { id:'sulfites',   label:'Sulfites',         emoji:'🍷' },
  { id:'lupin',      label:'Lupin',            emoji:'🌼' },
  { id:'gelatine',   label:'Gélatine',         emoji:'🧪' },
];

// Colonnes Sheets existantes (pour lecture)
const ALLERGENS_SHEETS = [
  { id:'fruits_coq', col:'Fruit a coque' },
  { id:'gelatine',   col:'Gelatine'      },
  { id:'gluten',     col:'Gluten'        },
  { id:'lait',       col:'Lait'          },
  { id:'oeufs',      col:'Oeuf'          },
];

let fiches = [];
let editingId = null;
// editStates : Map<allergeneId, 'oui'|'non'|'inconnu'>
let editStates = new Map();
let filterMode = 'tous';
let filterSelected = new Set();


function getStoredUser() {
  try { return JSON.parse(localStorage.getItem('sl_user') || '{}'); }
  catch(e) { return {}; }
}

function canUseSupabase() {
  return !!localStorage.getItem('sl_access_token');
}

async function sbRpcScalar(functionName, accessToken) {
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${functionName}`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON,
        'Authorization': `Bearer ${accessToken}`,
      },
      body: '{}',
    });
    if (!r.ok) return null;
    const text = await r.text();
    return text ? JSON.parse(text) : null;
  } catch(e) {
    return null;
  }
}

async function ensureSupabaseUserReady() {
  const token = localStorage.getItem('sl_access_token');
  let stored = getStoredUser();
  if (!token || stored.tenant_id) return stored;

  try {
    const authResp = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
      headers: { 'apikey': SUPABASE_ANON, 'Authorization': `Bearer ${token}` },
    });
    const authUser = authResp.ok ? await authResp.json() : {};
    let profile = null;
    const userId = authUser.id || stored.id;

    if (userId) {
      const profileResp = await fetch(`${SUPABASE_URL}/rest/v1/profiles?id=eq.${userId}&select=role,tenant_id`, {
        headers: { 'apikey': SUPABASE_ANON, 'Authorization': `Bearer ${token}` },
      });
      if (profileResp.ok) {
        const data = await profileResp.json();
        profile = Array.isArray(data) ? data[0] : null;
      }
    }

    if (!profile?.role || !profile?.tenant_id) {
      const [role, tenantId] = await Promise.all([
        sbRpcScalar('my_role', token),
        sbRpcScalar('my_tenant_id', token),
      ]);
      profile = {
        role: profile?.role || role || stored.role || 'employe',
        tenant_id: profile?.tenant_id || tenantId || null,
      };
    }

    stored = {
      id: userId || stored.id,
      email: authUser.email || stored.email,
      role: profile?.role || stored.role || 'employe',
      tenant_id: profile?.tenant_id || stored.tenant_id || null,
    };
    localStorage.setItem('sl_user', JSON.stringify(stored));
  } catch(e) {
    console.warn('[supabase] Session repair failed:', e.message);
  }

  return stored;
}

async function sbFetch(path, options={}) {
  const token = localStorage.getItem('sl_access_token');
  const r = await fetch(SUPABASE_URL + path, {
    ...options,
    headers: {
      'apikey': SUPABASE_ANON,
      'Authorization': `Bearer ${token}`,
      'Content-Type': 'application/json',
      'Prefer': 'return=representation',
      ...(options.headers || {})
    }
  });
  const text = await r.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch(e) { data = text; }
  if (!r.ok) throw new Error((data && (data.message || data.error)) || `Supabase ${r.status}`);
  return data;
}

function normalizeState(v) {
  const s = String(v ?? '').trim().toLowerCase();
  if (['oui','yes','true','1','x','present','présent'].includes(s)) return 'oui';
  if (['non','no','false','0','absent'].includes(s)) return 'non';
  return 'inconnu';
}

function rowToFiche(f, i=0) {
  const states = {};
  ALLERGENS.forEach(a => {
    if (f.states && f.states[a.id]) states[a.id] = normalizeState(f.states[a.id]);
    else if (f[a.id] !== undefined) states[a.id] = normalizeState(f[a.id]);
    else if (f.allergenes && String(f.allergenes).includes(a.id)) states[a.id] = 'oui';
    else {
      const sheetCol = ALLERGENS_SHEETS.find(s => s.id === a.id);
      states[a.id] = sheetCol ? 'non' : 'inconnu';
    }
  });
  return {
    id: f.id || 'row_' + i,
    nom: f.nom_gateau || f.nom || '',
    patissier: f.patissier || '',
    ingredients: f.ingredients || '',
    states,
  };
}

function ficheToSupabasePayload(nom, patissier, statesObj) {
  const user = getStoredUser();
  const payload = {
    tenant_id: user.tenant_id,
    nom_gateau: nom,
    patissier: patissier || null,
  };
  ALLERGENS.forEach(a => payload[a.id] = statesObj[a.id] || 'inconnu');
  return payload;
}

function toast(msg, isError=false) {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = 'toast';
  t.style.borderColor = isError ? 'var(--red)' : 'var(--green)';
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

// ── Filtre ──
function setMode(mode, btn) {
  filterMode = mode;
  filterSelected = new Set();
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  buildFilterChips();
  renderList();
}

function buildFilterChips() {
  const wrap = document.getElementById('filter-chips-wrap');
  const label = document.getElementById('filter-label');
  if (filterMode === 'tous') { wrap.style.display='none'; return; }
  wrap.style.display = 'block';
  label.textContent = filterMode === 'sans'
    ? 'Afficher les produits SANS ces allergènes :'
    : 'Afficher les produits AVEC ces allergènes :';
  document.getElementById('filter-chips').innerHTML = ALLERGENS.map(a => {
    const on = filterSelected.has(a.id);
    return `<div class="filter-chip ${on?'active':''}" onclick="toggleFilter('${a.id}',this)">${a.label}</div>`;
  }).join('');
}

function toggleFilter(id, el) {
  if (filterSelected.has(id)) { filterSelected.delete(id); el.classList.remove('active'); }
  else { filterSelected.add(id); el.classList.add('active'); }
  renderList();
}

// ── Rendu liste ──
function renderList() {
  const q = (document.getElementById('search').value || '').toLowerCase().trim();
  let items = q ? fiches.filter(f => f.nom.toLowerCase().includes(q)) : [...fiches];

  if (filterMode === 'sans' && filterSelected.size > 0) {
    items = items.filter(f =>
      [...filterSelected].every(id => f.states[id] !== 'oui')
    );
  } else if (filterMode === 'avec' && filterSelected.size > 0) {
    items = items.filter(f =>
      [...filterSelected].some(id => f.states[id] === 'oui')
    );
  }

  const filterInfo = filterSelected.size > 0 && filterMode !== 'tous' ? ' · filtre actif' : '';
  const sourceInfo = '';
  document.getElementById('stats').textContent =
    `${items.length} / ${fiches.length} fiche${fiches.length !== 1 ? 's' : ''}${filterInfo}${sourceInfo}`;

  const list = document.getElementById('list');
  if (!items.length) {
    list.innerHTML = `<div style="text-align:center;padding:60px 20px;color:var(--muted)">
      <div style="font-size:36px;margin-bottom:12px">⚠️</div>
      <div style="font-family:'Fraunces',serif;font-size:18px;margin-bottom:6px">${q || filterSelected.size > 0 ? 'Aucun résultat' : 'Aucune fiche'}</div>
      <div style="font-size:12px">${q || filterSelected.size > 0 ? 'Essaie d\'autres critères' : 'Clique sur ＋ Nouveau pour créer une fiche'}</div>
    </div>`;
    return;
  }

  list.innerHTML = items.map(f => {
    // Afficher uniquement les allergènes connus (oui ou non), ignorer inconnu
    const presents = ALLERGENS.filter(a => f.states[a.id] === 'oui');
    const absents  = ALLERGENS.filter(a => f.states[a.id] === 'non');
    const inconnus = ALLERGENS.filter(a => !f.states[a.id] || f.states[a.id] === 'inconnu');

    const badgesOui = presents.map(a => `<span class="badge-oui">${a.label}</span>`).join('');
    const badgesNon = absents.map(a => `<span class="badge-non">${a.label}</span>`).join('');
    const badgesInc = inconnus.map(a => `<span class="badge-inconnu">${a.label}</span>`).join('');

    return `<div class="product-card">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px">
        <div>
          <div style="font-family:'Fraunces',serif;font-size:17px;font-weight:700">${f.nom}</div>
          ${f.patissier ? `<div style="font-size:11px;color:var(--muted);margin-top:2px">👨‍🍳 ${f.patissier}</div>` : ''}
        </div>
        <div style="display:flex;gap:6px;flex-shrink:0;margin-left:10px">
          <button onclick="openEditModal('${f.id}')" style="padding:5px 10px;background:transparent;border:1px solid var(--border);border-radius:6px;font-size:11px;color:var(--muted);"><span class=ic-edit></span></button>
          <button onclick="deleteFiche('${f.id}')" style="padding:5px 10px;background:transparent;border:1px solid rgba(255,64,64,.3);border-radius:6px;font-size:11px;color:var(--red);"><span class=ic-del></span></button>
        </div>
      </div>
      ${presents.length ? `<div style="margin-bottom:6px"><div style="font-size:10px;color:var(--red);letter-spacing:1px;text-transform:uppercase;margin-bottom:4px">Contient :</div><div>${badgesOui}</div></div>` : ''}
      ${absents.length  ? `<div style="margin-bottom:6px"><div style="font-size:10px;color:var(--green);letter-spacing:1px;text-transform:uppercase;margin-bottom:4px">Absent :</div><div>${badgesNon}</div></div>` : ''}
      ${inconnus.length ? `<div><div style="font-size:10px;color:var(--yellow);letter-spacing:1px;text-transform:uppercase;margin-bottom:4px">Inconnu :</div><div>${badgesInc}</div></div>` : ''}
      ${f.ingredients ? `<div style="font-size:11px;color:var(--muted);background:var(--bg);border-radius:6px;padding:6px 10px;margin-top:8px">📝 ${f.ingredients}</div>` : ''}
    </div>`;
  }).join('');
}

// ── Modal ──
function buildChipsEdit() {
  document.getElementById('chips-edit').innerHTML = ALLERGENS.map(a => {
    const state = editStates.get(a.id) || 'inconnu';
    return `<div class="a-chip">
      <div class="a-chip-left">
        <span class="a-chip-label">${a.label}</span>
      </div>
      <div class="a-chip-toggle">
        <button onclick="setState('${a.id}','non',this.parentElement)" class="${state==='non'?'sel-non':''}">✓</button>
        <button onclick="setState('${a.id}','oui',this.parentElement)" class="${state==='oui'?'sel-oui':''}">✗</button>
        <button onclick="setState('${a.id}','inconnu',this.parentElement)" class="${state==='inconnu'?'sel-inconnu':''}">?</button>
      </div>
    </div>`;
  }).join('');
}

function setState(id, state, toggleEl) {
  editStates.set(id, state);
  // Mettre à jour visuellement les 3 boutons
  const btns = toggleEl.querySelectorAll('button');
  btns[0].className = state === 'non'     ? 'sel-non' : '';
  btns[1].className = state === 'oui'     ? 'sel-oui' : '';
  btns[2].className = state === 'inconnu' ? 'sel-inconnu' : '';
}

function openAddModal() {
  editingId = null;
  editStates = new Map();
  ALLERGENS.forEach(a => editStates.set(a.id, 'inconnu'));
  document.getElementById('edit-nom').value = '';
  document.getElementById('edit-patissier').value = '';
  document.getElementById('modal-edit-title').textContent = '＋ Nouvelle fiche';
  buildChipsEdit();
  document.getElementById('modal-edit').style.display = 'flex';
  setTimeout(() => document.getElementById('edit-nom').focus(), 100);
}

function openEditModal(id) {
  const f = fiches.find(x => x.id === id);
  if (!f) return;
  editingId = id;
  editStates = new Map();
  ALLERGENS.forEach(a => editStates.set(a.id, f.states[a.id] || 'inconnu'));
  document.getElementById('edit-nom').value = f.nom;
  document.getElementById('edit-patissier').value = f.patissier || '';
  document.getElementById('modal-edit-title').textContent = 'Modifier la fiche';
  buildChipsEdit();
  document.getElementById('modal-edit').style.display = 'flex';
}

function closeEditModal() { document.getElementById('modal-edit').style.display = 'none'; }

async function saveAllergens() {
  const nom = document.getElementById('edit-nom').value.trim();
  if (!nom) { toast('⚠ Le nom est obligatoire', true); return; }
  const patissier = document.getElementById('edit-patissier').value.trim();
  // Sérialiser les états : { gluten:'oui', lait:'non', ... }
  const statesObj = {};
  editStates.forEach((v, k) => statesObj[k] = v);
  toast('⏳ Enregistrement…');
  closeEditModal();
  {
    try {
      const payload = ficheToSupabasePayload(nom, patissier, statesObj);
      if (editingId && !String(editingId).startsWith('row_')) {
        await sbFetch(`/rest/v1/allergenes?id=eq.${encodeURIComponent(editingId)}`, {
          method: 'PATCH',
          body: JSON.stringify(payload)
        });
      } else {
        await sbFetch('/rest/v1/allergenes', {
          method: 'POST',
          body: JSON.stringify(payload)
        });
      }
      toast(`✓ Fiche "${nom}" enregistrée`);
      await loadFiches();
    } catch(e) {
      toast(`⚠ ${e.message}`, true);
    }
    return;
  }
}

async function deleteFiche(id) {
  const f = fiches.find(x => x.id === id);
  if (!f || !confirm(`Supprimer la fiche "${f.nom}" ?`)) return;
  {
    try {
      await sbFetch(`/rest/v1/allergenes?id=eq.${encodeURIComponent(id)}`, { method:'DELETE' });
      fiches = fiches.filter(x => x.id !== id);
      renderList();
      toast('✓ Fiche supprimée');
    } catch(e) {
      toast(`⚠ ${e.message}`, true);
    }
    return;
  }
}

// ── Chargement ──
async function loadFiches() {
  const list = document.getElementById('list');
  list.innerHTML = '<div style="text-align:center;padding:40px;color:var(--muted)">⏳ Chargement…</div>';
  if (canUseSupabase()) {
    const user = await ensureSupabaseUserReady();
    try {
      if (!user.tenant_id) throw new Error('Tenant Supabase manquant');
      const rows = await sbFetch(`/rest/v1/allergenes?tenant_id=eq.${encodeURIComponent(user.tenant_id)}&select=*&order=nom_gateau.asc`);
      fiches = (Array.isArray(rows) ? rows : []).map(rowToFiche);
      renderList();
      return;
    } catch(e) {
      console.warn('[allergenes] Supabase indisponible:', e.message);
      fiches = [];
      renderList();
      toast('Impossible de charger les allergenes Supabase', true);
      return;
    }
  }
}

// Attendre que le guard soit résolu ET que le DOM soit prêt
function _runWhenReady() {
  if (window.__guardPassed === true) {
    loadFiches();
  } else if (window.__guardPassed === false) {
    // Bloqué — ne rien faire
  } else {
    // Guard encore en cours — réessayer
    setTimeout(_runWhenReady, 50);
  }
}
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', _runWhenReady);
} else {
  _runWhenReady();
}
</script>
