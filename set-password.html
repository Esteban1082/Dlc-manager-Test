<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StoreLine — Mot de passe</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e8a045">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
<script id="sl-helpers">
// StoreLine — utilitaires communs : échappement HTML, recherche sans accents, messages d'erreur lisibles
window.esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
window.norm = function (s) { return String(s == null ? '' : s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim(); };
window.localISO = function (d) { d = d ? new Date(d) : new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
window.slFetch = function (url, opts) {
  return fetch(url, opts).catch(function () { throw new Error('Pas de connexion. Réessaie dans un instant.'); });
};
window.slErrMsg = function (status, data) {
  var code = data && data.code, msg = String((data && (data.message || data.error_description || data.error)) || '');
  if (code === '23505') {
    if (/code_barres|barcode/i.test(msg)) return 'Ce code-barres est déjà utilisé';
    return 'Cet élément existe déjà';
  }
  if (code === '23503') return 'Élément encore utilisé ailleurs : action impossible';
  if (code === '42501' || status === 403) return "Tu n'as pas les droits pour cette action";
  if (status === 401 || /jwt/i.test(msg)) return 'Session expirée, reconnecte-toi';
  if (code === '22P02' || code === '23502' || code === '23514' || code === '22007' || code === '22008') return 'Donnée invalide, vérifie les champs';
  if (status >= 500) return 'Le serveur ne répond pas, réessaie dans un instant';
  return msg || ('Erreur ' + status);
};
// Page restée ouverte (tablette en magasin) : on recharge au changement de jour pour que « aujourd'hui » reste juste
(function () {
  if (/login|set-password/.test(location.pathname)) return;
  var day = window.localISO();
  function check() { if (document.visibilityState === 'visible' && window.localISO() !== day) location.reload(); }
  document.addEventListener('visibilitychange', check);
  setInterval(check, 5 * 60 * 1000);
})();
</script>
<script>
(function(){ try { var t = localStorage.getItem('sl_ui_theme') || 'light'; if (t === 'light') document.documentElement.dataset.theme = 'light'; } catch(e) {} })();
</script>
<style>
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  :root { --sans:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Helvetica Neue', sans-serif; --serif:'Fraunces', Georgia, serif; }
  html:not([data-theme="light"]) { --bg:#161412; --surface:#211e1b; --surface2:#2b2723; --border:#3a342e; --text:#f4efe7; --muted:#a3978a; --link:#f0b264; --red:#ff7a6e; --red-bg:rgba(255,122,110,.12); --green:#6fcf97; }
  html[data-theme="light"] { --bg:#f4efe7; --surface:#fffcf7; --surface2:#f1e6d6; --border:#e2d7c9; --text:#23201c; --muted:#6e6256; --link:#ad5a10; --red:#b3261e; --red-bg:#fbece9; --green:#2f6b45; }
  body { min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--text); font-family:var(--sans); -webkit-font-smoothing:antialiased; padding:calc(env(safe-area-inset-top) + 24px) 0 calc(env(safe-area-inset-bottom) + 40px); }
  .card { width:100%; max-width:380px; padding:0 24px; }
  .mark { width:76px; height:76px; border-radius:20px; background:#e8a045; color:#fff; display:flex; align-items:center; justify-content:center; margin:0 auto 18px; box-shadow:0 12px 30px rgba(232,160,69,.35); font-family:var(--serif); font-size:44px; font-weight:700; }
  h1 { font-family:var(--serif); font-size:32px; font-weight:700; letter-spacing:-.6px; text-align:center; }
  .sub { text-align:center; color:var(--muted); font-size:16px; margin:6px 0 28px; line-height:1.4; }
  label { display:block; font-size:13px; font-weight:600; color:var(--muted); margin:0 0 6px 4px; }
  input { width:100%; height:52px; padding:0 16px; background:var(--surface); border:1px solid var(--border); border-radius:14px; font-size:17px; color:var(--text); margin-bottom:14px; font-family:var(--sans); }
  input:focus { outline:none; border-color:#e8a045; box-shadow:0 0 0 4px rgba(232,160,69,.18); }
  .rules { list-style:none; margin:-4px 4px 18px; display:grid; grid-template-columns:1fr 1fr; gap:4px 12px; font-size:13px; color:var(--muted); }
  .rules li::before { content:'○ '; }
  .rules li.ok { color:var(--green); }
  .rules li.ok::before { content:''; }
  .btn { width:100%; height:54px; border:none; border-radius:999px; background:#e8a045; color:#23201c; font-size:17px; font-weight:700; cursor:pointer; box-shadow:0 8px 22px rgba(232,160,69,.35); font-family:var(--sans); }
  .btn:disabled { opacity:.55; cursor:default; box-shadow:none; }
  .msg { display:none; border-radius:14px; padding:12px 14px; font-size:14px; margin-bottom:16px; line-height:1.4; }
  .msg.err { display:block; background:var(--red-bg); color:var(--red); }
  .sep { display:flex; align-items:center; gap:12px; margin:26px 0 16px; color:var(--muted); font-size:13px; }
  .sep::before, .sep::after { content:''; flex:1; height:1px; background:var(--border); }
  .btn-sso { width:100%; height:50px; display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:10px; border-radius:999px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:16px; font-weight:600; cursor:pointer; font-family:var(--sans); }
  .back { display:block; text-align:center; margin-top:20px; color:var(--link); font-size:15px; text-decoration:none; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div class="card">
  <div class="mark">S</div>
  <h1 id="title">Bienvenue</h1>
  <p class="sub" id="sub">Choisis ton mot de passe pour accéder à StoreLine.</p>

  <div class="msg" id="msg"></div>

  <form id="form" class="hidden" onsubmit="event.preventDefault(); savePassword();">
    <label for="pwd">Nouveau mot de passe</label>
    <input id="pwd" type="password" autocomplete="new-password" oninput="checkRules()">
    <label for="pwd2">Confirme le mot de passe</label>
    <input id="pwd2" type="password" autocomplete="new-password" oninput="checkRules()">
    <ul class="rules" id="rules">
      <li data-r="len">10 caractères minimum</li>
      <li data-r="up">Une majuscule</li>
      <li data-r="low">Une minuscule</li>
      <li data-r="num">Un chiffre</li>
      <li data-r="sym">Un symbole</li>
      <li data-r="same">Identiques</li>
    </ul>
    <button class="btn" id="btn" type="submit" disabled>Enregistrer et continuer</button>
  </form>

  <div id="sso" class="hidden">
    <div class="sep"><span>ou</span></div>
    <button class="btn-sso" onclick="loginWith('google')"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg><span>Utiliser mon compte Google</span></button>
    <button class="btn-sso" onclick="loginWith('azure')"><svg width="17" height="17" viewBox="0 0 23 23" aria-hidden="true"><path fill="#f35325" d="M1 1h10v10H1z"/><path fill="#81bc06" d="M12 1h10v10H12z"/><path fill="#05a6f0" d="M1 12h10v10H1z"/><path fill="#ffba08" d="M12 12h10v10H12z"/></svg><span>Utiliser mon compte Microsoft</span></button>
  </div>

  <a class="back" href="login.html">Retour à la connexion</a>
</div>

<script>
const SUPABASE_URL  = 'https://jeqptodorjzeyhapbmrz.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImplcXB0b2Rvcmp6ZXloYXBibXJ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NjI0ODksImV4cCI6MjA4OTIzODQ4OX0.j4JqeDnDMEghnBtKy5Knpb4QYDFEXiRtDeq7SSz3zWk';
let accessToken = null, refreshToken = null;

function showError(t) { const m = document.getElementById('msg'); m.className = 'msg err'; m.textContent = t; }
function pageUrl(name) { return location.origin + location.pathname.replace(/[^/]*$/, '') + name; }
function loginWith(provider) {
  const p = new URLSearchParams({ provider, redirect_to: pageUrl('login.html') });
  if (provider === 'azure') p.set('scopes', 'email');
  location.href = `${SUPABASE_URL}/auth/v1/authorize?${p}`;
}

const RULES = {
  len:  v => v.length >= 10,
  up:   v => /[A-Z]/.test(v),
  low:  v => /[a-z]/.test(v),
  num:  v => /[0-9]/.test(v),
  sym:  v => /[^A-Za-z0-9]/.test(v),
};
function checkRules() {
  const v = document.getElementById('pwd').value, v2 = document.getElementById('pwd2').value;
  let all = true;
  document.querySelectorAll('#rules li').forEach(li => {
    const r = li.dataset.r;
    const ok = r === 'same' ? (v.length > 0 && v === v2) : RULES[r](v);
    li.classList.toggle('ok', ok);
    if (!ok) all = false;
  });
  document.getElementById('btn').disabled = !all;
  return all;
}

async function savePassword() {
  if (!checkRules()) return;
  const btn = document.getElementById('btn');
  btn.disabled = true; btn.textContent = 'Enregistrement…';
  try {
    const r = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
      method: 'PUT',
      headers: { 'Content-Type':'application/json', 'apikey': SUPABASE_ANON, 'Authorization': `Bearer ${accessToken}` },
      body: JSON.stringify({ password: document.getElementById('pwd').value }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) {
      const t = d.msg || d.error_description || d.message || 'Erreur';
      throw new Error(/weak|characters|length/i.test(t) ? 'Mot de passe trop faible : respecte toutes les règles.'
        : /same|different/i.test(t) ? 'Choisis un mot de passe différent de l’ancien.' : t);
    }
    await finishLogin();
  } catch(e) {
    showError(e.message);
    btn.textContent = 'Enregistrer et continuer';
    checkRules();
  }
}

async function finishLogin() {
  const ur = await fetch(`${SUPABASE_URL}/auth/v1/user`, { headers: { 'apikey': SUPABASE_ANON, 'Authorization': `Bearer ${accessToken}` } });
  const user = await ur.json();
  const pr = await fetch(`${SUPABASE_URL}/rest/v1/profiles?id=eq.${user.id}&select=role,tenant_id,actif`, { headers: { 'apikey': SUPABASE_ANON, 'Authorization': `Bearer ${accessToken}` } });
  const profile = (await pr.json().catch(() => []))[0] || {};
  localStorage.setItem('sl_access_token', accessToken);
  if (refreshToken) localStorage.setItem('sl_refresh_token', refreshToken);
  localStorage.setItem('sl_auth', '1');
  const role = profile.role || 'employe';
  localStorage.setItem('sl_user', JSON.stringify({ id:user.id, email:user.email, role, tenant_id:profile.tenant_id || null }));
  location.replace(role === 'superadmin' || role === 'admin' ? 'admin.html' : 'hub.html');
}

(async function init() {
  const h = new URLSearchParams(location.hash.slice(1));
  const q = new URLSearchParams(location.search);
  const err = h.get('error_description') || q.get('error_description');
  history.replaceState(null, '', location.pathname);
  if (err) {
    document.getElementById('title').textContent = 'Lien expiré';
    document.getElementById('sub').textContent = 'Ce lien n’est plus valable (il ne sert qu’une fois et expire après 24 h). Demande un nouveau lien à ton responsable, ou utilise « Mot de passe oublié ».';
    return;
  }
  accessToken = h.get('access_token') || localStorage.getItem('sl_access_token');
  refreshToken = h.get('refresh_token') || localStorage.getItem('sl_refresh_token');
  const type = h.get('type');
  if (!accessToken) {
    document.getElementById('title').textContent = 'Lien invalide';
    document.getElementById('sub').textContent = 'Ouvre le lien reçu par e-mail, ou reviens à la page de connexion.';
    return;
  }
  try {
    const ur = await fetch(`${SUPABASE_URL}/auth/v1/user`, { headers: { 'apikey': SUPABASE_ANON, 'Authorization': `Bearer ${accessToken}` } });
    if (!ur.ok) throw new Error();
    const user = await ur.json();
    const prenom = (user.user_metadata && user.user_metadata.nom) || '';
    if (type === 'recovery' || (!type && user.last_sign_in_at)) {
      document.getElementById('title').textContent = 'Nouveau mot de passe';
      document.getElementById('sub').textContent = user.email;
    } else {
      document.getElementById('title').textContent = prenom ? 'Bienvenue ' + prenom.split(' ')[0] : 'Bienvenue';
      document.getElementById('sub').textContent = 'Choisis ton mot de passe pour ' + user.email + (user.user_metadata && user.user_metadata.tenant_nom ? ' · ' + user.user_metadata.tenant_nom : '') + '.';
      document.getElementById('sso').classList.remove('hidden');
    }
    document.getElementById('form').classList.remove('hidden');
    setTimeout(() => document.getElementById('pwd').focus(), 100);
  } catch(e) {
    document.getElementById('title').textContent = 'Lien expiré';
    document.getElementById('sub').textContent = 'Demande un nouveau lien à ton responsable.';
  }
})();
</script>
</body>
</html>
