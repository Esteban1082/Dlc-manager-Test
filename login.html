<script id="sl-helpers">
// StoreLine — utilitaires communs : échappement HTML, recherche sans accents, messages d'erreur lisibles
window.esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
window.norm = function (s) { return String(s == null ? '' : s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim(); };
window.localISO = function (d) { d = d ? new Date(d) : new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
window.slFetch = function (url, opts) {
  return fetch(url, opts).catch(function () { throw new Error('Pas de connexion. Réessaie dans un instant.'); });
};
window.slErrMsg = function (status, data) {
  var code = data && data.code, msg = String((data && (data.message || data.error_description || data.error)) || '');
  if (code === '23505') {
    if (/code_barres|barcode/i.test(msg)) return 'Ce code-barres est déjà utilisé';
    return 'Cet élément existe déjà';
  }
  if (code === '23503') return 'Élément encore utilisé ailleurs : action impossible';
  if (code === '42501' || status === 403) return "Tu n'as pas les droits pour cette action";
  if (status === 401 || /jwt/i.test(msg)) return 'Session expirée, reconnecte-toi';
  if (code === '22P02' || code === '23502' || code === '23514' || code === '22007' || code === '22008') return 'Donnée invalide, vérifie les champs';
  if (status >= 500) return 'Le serveur ne répond pas, réessaie dans un instant';
  return msg || ('Erreur ' + status);
};
// Page restée ouverte (tablette en magasin) : on recharge au changement de jour pour que « aujourd'hui » reste juste
(function () {
  if (/login|set-password/.test(location.pathname)) return;
  var day = window.localISO();
  function check() { if (document.visibilityState === 'visible' && window.localISO() !== day) location.reload(); }
  document.addEventListener('visibilitychange', check);
  setInterval(check, 5 * 60 * 1000);
})();
</script>

})();

<script>
const SUPABASE_URL  = 'https://jeqptodorjzeyhapbmrz.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImplcXB0b2Rvcmp6ZXloYXBibXJ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NjI0ODksImV4cCI6MjA4OTIzODQ4OX0.j4JqeDnDMEghnBtKy5Knpb4QYDFEXiRtDeq7SSz3zWk';

// ── API Supabase via fetch natif (pas de lib, pas d'eval) ──
async function sbAuth(email, password) {
  const r = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apikey': SUPABASE_ANON,
    },
    body: JSON.stringify({ email, password }),
  });
  return r.json();
}

async function sbGetProfile(userId, accessToken) {
  let profile = null;

  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/profiles?id=eq.${userId}&select=role,tenant_id`, {
      headers: {
        'apikey': SUPABASE_ANON,
        'Authorization': `Bearer ${accessToken}`,
      },
    });
    if (r.ok) {
      const data = await r.json();
      profile = Array.isArray(data) ? data[0] : null;
    } else {
      console.warn('Profile direct read blocked:', r.status);
    }
  } catch(e) {
    console.warn('Profile direct read failed:', e);
  }

  if (!profile?.role || !profile?.tenant_id) {
    const [role, tenantId] = await Promise.all([
      sbRpcScalar('my_role', accessToken),
      sbRpcScalar('my_tenant_id', accessToken),
    ]);
    profile = {
      role: profile?.role || role || 'employe',
      tenant_id: profile?.tenant_id || tenantId || null,
    };
  }

  return profile;
}

async function sbRpcScalar(functionName, accessToken) {
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${functionName}`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON,
        'Authorization': `Bearer ${accessToken}`,
      },
      body: '{}',
    });
    if (!r.ok) {
      console.warn(`RPC ${functionName} blocked:`, r.status);
      return null;
    }
    const text = await r.text();
    return text ? JSON.parse(text) : null;
  } catch(e) {
    console.warn(`RPC ${functionName} failed:`, e);
    return null;
  }
}

// ── UI ──
function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg;
  el.style.cssText = 'display:block;background:rgba(255,64,64,.1);border:1px solid rgba(255,64,64,.3);color:var(--red)';
  el.style.animation = 'none';
  requestAnimationFrame(() => el.style.animation = 'shake .3s ease');
}
function hideError() { document.getElementById('error-msg').style.display = 'none'; }

async function login() {
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn      = document.getElementById('btn-login');

  if (!email || !password) { showError('Remplis les deux champs.'); return; }
  hideError();
  btn.disabled = true;
  btn.textContent = 'Connexion…';
  btn.classList.add('btn-loading');

  try {
    const authData = await sbAuth(email, password);

    if (authData.error || !authData.access_token) {
      btn.disabled = false;
      btn.textContent = 'Se connecter';
      btn.classList.remove('btn-loading');
      const msg = authData.error_description || authData.message || authData.error || 'Erreur de connexion';
      if (msg.includes('Invalid login')) showError('Email ou mot de passe incorrect.');
      else if (msg.includes('Email not confirmed')) showError('Confirme ton email avant de te connecter.');
      else showError(msg);
      return;
    }

    btn.textContent = 'Connecté !';
    try { await finishLogin(authData.access_token, authData.refresh_token); }
    catch(err) {
      btn.disabled = false; btn.textContent = 'Se connecter'; btn.classList.remove('btn-loading');
      showError(err.message);
    }

  } catch(e) {
    btn.disabled = false;
    btn.textContent = 'Se connecter';
    btn.classList.remove('btn-loading');
    showError('Erreur réseau — vérifie ta connexion.');
    console.error(e);
  }
}

async function forgotPassword() {
  const email = document.getElementById('email').value.trim();
  if (!email) { showError('Entre ton email avant de continuer.'); return; }
  try {
    await fetch(`${SUPABASE_URL}/auth/v1/recover?redirect_to=${encodeURIComponent(pageUrl('set-password.html'))}`, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'apikey': SUPABASE_ANON },
      body: JSON.stringify({ email }),
    });
    hideError();
    showInfo('Si un compte existe pour cette adresse, un email de réinitialisation vient d’être envoyé.');
  } catch(e) { showError('Erreur réseau.'); }
}

function showInfo(msg) { const el = document.getElementById('info-msg'); el.textContent = msg; el.style.display = 'block'; }
function pageUrl(name) { return location.origin + location.pathname.replace(/[^/]*$/, '') + name; }

// ── Connexion Google / Microsoft ──
function loginWith(provider) {
  const params = new URLSearchParams({ provider, redirect_to: pageUrl('login.html') });
  if (provider === 'azure') params.set('scopes', 'email');
  window.location.href = `${SUPABASE_URL}/auth/v1/authorize?${params}`;
}

// Enregistre la session et redirige selon le rôle (connexion classique, Google ou Microsoft)
async function finishLogin(accessToken, refreshToken) {
  const ur = await fetch(`${SUPABASE_URL}/auth/v1/user`, { headers: { 'apikey': SUPABASE_ANON, 'Authorization': `Bearer ${accessToken}` } });
  if (!ur.ok) throw new Error('Session invalide');
  const user = await ur.json();
  const profile = await sbGetProfile(user.id, accessToken);
  if (!profile?.tenant_id && profile?.role !== 'superadmin') {
    // Compte sans invitation (aucun magasin) : on ne le laisse pas entrer
    await fetch(`${SUPABASE_URL}/auth/v1/logout`, { method:'POST', headers:{ 'apikey': SUPABASE_ANON, 'Authorization': `Bearer ${accessToken}` } }).catch(() => {});
    throw new Error('Ce compte n’a pas encore accès à StoreLine. Demande une invitation à ton responsable.');
  }
  localStorage.setItem('sl_access_token',  accessToken);
  localStorage.setItem('sl_refresh_token', refreshToken || '');
  localStorage.setItem('sl_auth', '1');
  const role = profile?.role || 'employe';
  localStorage.setItem('sl_user', JSON.stringify({ id:user.id, email:user.email, role, tenant_id:profile?.tenant_id || null }));
  window.location.replace('hub.html');
}

// Retour d'un lien (Google/Microsoft, invitation, réinitialisation, erreur)
async function handleAuthReturn() {
  const h = new URLSearchParams(location.hash.slice(1));
  const q = new URLSearchParams(location.search);
  if (q.get('expired')) showInfo('Ta session a expiré, reconnecte-toi.');
  const err = h.get('error_description') || q.get('error_description');
  if (err) {
    history.replaceState(null, '', location.pathname);
    if (/signup|not allowed|disabled/i.test(err)) showError('Ce compte n’a pas encore accès à StoreLine. Demande une invitation à ton responsable.');
    else if (/expired|invalid/i.test(err)) showError('Ce lien a expiré. Demande un nouveau lien à ton responsable.');
    else showError(decodeURIComponent(err.replace(/\+/g, ' ')));
    return true;
  }
  const type = h.get('type');
  if (type === 'invite' || type === 'recovery' || type === 'signup' || type === 'magiclink') {
    location.replace('set-password.html' + location.hash);
    return true;
  }
  const at = h.get('access_token');
  if (at) {
    history.replaceState(null, '', location.pathname);
    showInfo('Connexion en cours…');
    try { await finishLogin(at, h.get('refresh_token')); }
    catch(e) { document.getElementById('info-msg').style.display = 'none'; showError(e.message); }
    return true;
  }
  return false;
}

// Vérifier si déjà connecté — seulement si on ne vient PAS d'un redirect
async function checkExistingSession() {
  // Si on arrive avec ?from=admin ou ?from=hub c'est un redirect — ne pas boucler
  const params = new URLSearchParams(window.location.search);
  if (params.get('from')) return;

  const token = localStorage.getItem('sl_access_token');
  if (!token) return;

  try {
    const r = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
      headers: { 'apikey': SUPABASE_ANON, 'Authorization': `Bearer ${token}` }
    });
    if (!r.ok) {
      // Token invalide — nettoyer
      localStorage.removeItem('sl_access_token');
      localStorage.removeItem('sl_refresh_token');
      localStorage.removeItem('sl_auth');
      localStorage.removeItem('sl_user');
      return;
    }
    const user = await r.json();
    const profile = await sbGetProfile(user.id, token);
    const role = profile?.role || 'employe';
    localStorage.setItem('sl_user', JSON.stringify({ id:user.id, email:user.email, role, tenant_id:profile?.tenant_id }));
    window.location.replace('hub.html');
  } catch(e) {
    // En cas d'erreur réseau — ne pas rediriger, laisser l'utilisateur se connecter manuellement
    console.warn('Session check failed:', e);
  }
}

handleAuthReturn().then(done => { if (!done) checkExistingSession(); });
</script>
