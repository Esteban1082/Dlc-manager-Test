<style>
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  :root {
    --bg:      #0a0a08;
    --surface: #141410;
    --border:  #252520;
    --text:    #f0ede4;
    --muted:   #6a6a5e;
    --amber:   #e8a045;
    --amber2:  #f5c060;
    --red:     #ff4040;
    --green:   #4cdb8a;
  }
  /* StoreLine theme */
  html[data-theme="light"] {
    --bg:#f7f3eb; --surface:#fffdf8; --surface2:#f0e8dc;
    --border:#e0d6c7; --border2:#c9bca9;
    --text:#211d18; --muted:#766b5f;
    --amber:#b96f22; --amber2:#d9913d;
    --red:#c93636; --red-bg:rgba(201,54,54,.10);
    --yellow:#b98916; --yellow-bg:rgba(185,137,22,.12);
    --green:#167a4a; --green-bg:rgba(22,122,74,.10);
    --blue:#1f75a8; --purple:#7c55c7;
    --grey:#8d8378; --grey-bg:rgba(141,131,120,.12);
  }
  body { transition:background .18s ease,color .18s ease; }
  .theme-toggle-global {
    position:fixed; top:12px; right:12px; z-index:1200;
    min-width:70px; height:34px; border-radius:999px; padding:0 12px;
    display:flex; align-items:center; justify-content:center;
    background:var(--surface); color:var(--amber);
    border:1px solid var(--border); box-shadow:0 10px 24px rgba(0,0,0,.18);
    font-size:11px;font-weight:700; cursor:pointer; line-height:1;
  }
  .theme-toggle-global:hover { border-color:var(--amber); color:var(--amber2); transform:translateY(-1px); }
  html[data-theme="light"] .theme-toggle-global { box-shadow:0 10px 24px rgba(84,62,37,.12); }
  @media(max-width:640px){ .theme-toggle-global { top:auto; right:12px; bottom:72px; } }


  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Fond animé */
  .bg-grid {
    position: fixed; inset: 0; z-index: 0;
    background-image:
      linear-gradient(rgba(232,160,69,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(232,160,69,.03) 1px, transparent 1px);
    background-size: 48px 48px;
    animation: gridDrift 20s linear infinite;
  }
  @keyframes gridDrift { from { transform: translateY(0); } to { transform: translateY(48px); } }

  .glow {
    position: fixed;
    width: 600px; height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(232,160,69,.06) 0%, transparent 70%);
    top: -200px; left: -200px;
    z-index: 0;
    animation: glowPulse 4s ease-in-out infinite;
  }
  @keyframes glowPulse { 0%,100%{opacity:.5;transform:scale(1)} 50%{opacity:1;transform:scale(1.1)} }

  .card {
    position: relative; z-index: 1;
    width: 100%; max-width: 400px;
    padding: 40px 36px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: 0 32px 64px rgba(0,0,0,.5), 0 0 0 1px rgba(232,160,69,.05);
    animation: cardIn .4s cubic-bezier(0.16, 1, 0.3, 1);
    margin: 20px;
  }
  @keyframes cardIn { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:none} }

  .logo { text-align: center; margin-bottom: 32px; }
  .logo-icon {
    width: 56px; height: 56px; margin: 0 auto 14px;
    background: linear-gradient(135deg, var(--amber), var(--amber2));
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    box-shadow: 0 8px 24px rgba(232,160,69,.3);
  }
  .logo-name {
    font-family: 'Fraunces', serif;
    font-size: 28px; font-weight: 900;
    color: var(--amber);
    letter-spacing: -0.5px;
  }
  .logo-sub {
    font-size: 11px; color: var(--muted);
    letter-spacing: 2px; text-transform: uppercase;
    margin-top: 4px;
  }

  .tenant-badge {
    display: flex; align-items: center; gap: 8px;
    background: rgba(232,160,69,.08);
    border: 1px solid rgba(232,160,69,.2);
    border-radius: 8px;
    padding: 8px 12px;
    margin-bottom: 24px;
    font-size: 12px; color: var(--amber2);
  }
  .tenant-badge-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 6px var(--green);
    flex-shrink: 0;
  }

  label {
    display: block;
    font-size: 10px; color: var(--muted);
    letter-spacing: 1.5px; text-transform: uppercase;
    margin-bottom: 6px;
  }

  input {
    width: 100%;
    padding: 12px 16px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
    margin-bottom: 16px;
  }
  input:focus {
    border-color: var(--amber);
    box-shadow: 0 0 0 3px rgba(232,160,69,.1);
  }
  input::placeholder { color: var(--muted); }

  .btn-login {
    width: 100%;
    padding: 14px;
    background: var(--amber);
    border: none; border-radius: 10px;
    font-family: 'Fraunces', serif;
    font-size: 16px; font-weight: 700;
    color: #000;
    cursor: pointer;
    transition: all .15s;
    margin-top: 4px;
    position: relative; overflow: hidden;
  }
  .btn-login:hover { background: var(--amber2); transform: translateY(-1px); box-shadow: 0 8px 20px rgba(232,160,69,.3); }
  .btn-login:active { transform: scale(0.98); }
  .btn-login:disabled { opacity: .6; cursor: not-allowed; transform: none; }

  .btn-loading::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.15), transparent);
    animation: shimmer 1s infinite;
  }
  @keyframes shimmer { from{transform:translateX(-100%)} to{transform:translateX(100%)} }

  .error-msg {
    display: none;
    background: rgba(255,64,64,.1);
    border: 1px solid rgba(255,64,64,.3);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 12px; color: var(--red);
    margin-bottom: 16px;
    animation: shake .3s ease;
  }
  @keyframes shake { 0%,100%{transform:none} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }

  .forgot-link {
    display: block; text-align: center;
    font-size: 11px; color: var(--muted);
    margin-top: 16px; cursor: pointer;
    text-decoration: none;
    transition: color .15s;
  }
  .forgot-link:hover { color: var(--amber); }

  .version { position: fixed; bottom: 16px; left: 0; right: 0; text-align: center; font-size: 10px; color: var(--border); letter-spacing: 1px; }
  .theme-toggle-global, #theme-toggle { display:none !important; }
</style>

<button class="theme-toggle-global" id="theme-toggle-global" onclick="toggleStoreLineTheme()" title="Mode clair / sombre" aria-label="Mode clair ou sombre">Clair</button>
<script>
(function(){
  function applyStoreLineTheme(theme) {
    var next = theme === 'light' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    
    var btn = document.getElementById('theme-toggle-global');
    if (btn) btn.textContent = next === 'light' ? 'Sombre' : 'Clair';
  }
  window.toggleStoreLineTheme = function() {
    applyStoreLineTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light');
  };
  applyStoreLineTheme(document.documentElement.dataset.theme === 'light' ? 'light' : 'dark');
})();
</script>

<script>
const SUPABASE_URL  = 'https://jeqptodorjzeyhapbmrz.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImplcXB0b2Rvcmp6ZXloYXBibXJ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NjI0ODksImV4cCI6MjA4OTIzODQ4OX0.j4JqeDnDMEghnBtKy5Knpb4QYDFEXiRtDeq7SSz3zWk';

// ── API Supabase via fetch natif (pas de lib, pas d'eval) ──
async function sbAuth(email, password) {
  const r = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apikey': SUPABASE_ANON,
    },
    body: JSON.stringify({ email, password }),
  });
  return r.json();
}

async function sbGetProfile(userId, accessToken) {
  let profile = null;

  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/profiles?id=eq.${userId}&select=role,tenant_id`, {
      headers: {
        'apikey': SUPABASE_ANON,
        'Authorization': `Bearer ${accessToken}`,
      },
    });
    if (r.ok) {
      const data = await r.json();
      profile = Array.isArray(data) ? data[0] : null;
    } else {
      console.warn('Profile direct read blocked:', r.status);
    }
  } catch(e) {
    console.warn('Profile direct read failed:', e);
  }

  if (!profile?.role || !profile?.tenant_id) {
    const [role, tenantId] = await Promise.all([
      sbRpcScalar('my_role', accessToken),
      sbRpcScalar('my_tenant_id', accessToken),
    ]);
    profile = {
      role: profile?.role || role || 'employe',
      tenant_id: profile?.tenant_id || tenantId || null,
    };
  }

  return profile;
}

async function sbRpcScalar(functionName, accessToken) {
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${functionName}`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON,
        'Authorization': `Bearer ${accessToken}`,
      },
      body: '{}',
    });
    if (!r.ok) {
      console.warn(`RPC ${functionName} blocked:`, r.status);
      return null;
    }
    const text = await r.text();
    return text ? JSON.parse(text) : null;
  } catch(e) {
    console.warn(`RPC ${functionName} failed:`, e);
    return null;
  }
}

// ── UI ──
function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg;
  el.style.cssText = 'display:block;background:rgba(255,64,64,.1);border:1px solid rgba(255,64,64,.3);color:var(--red)';
  el.style.animation = 'none';
  requestAnimationFrame(() => el.style.animation = 'shake .3s ease');
}
function hideError() { document.getElementById('error-msg').style.display = 'none'; }

async function login() {
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn      = document.getElementById('btn-login');

  if (!email || !password) { showError('Remplis les deux champs.'); return; }
  hideError();
  btn.disabled = true;
  btn.textContent = 'Connexion…';
  btn.classList.add('btn-loading');

  try {
    const authData = await sbAuth(email, password);

    if (authData.error || !authData.access_token) {
      btn.disabled = false;
      btn.textContent = 'Se connecter';
      btn.classList.remove('btn-loading');
      const msg = authData.error_description || authData.message || authData.error || 'Erreur de connexion';
      if (msg.includes('Invalid login')) showError('Email ou mot de passe incorrect.');
      else if (msg.includes('Email not confirmed')) showError('Confirme ton email avant de te connecter.');
      else showError(msg);
      return;
    }

    // Stocker les tokens
    localStorage.setItem('sl_access_token',  authData.access_token);
    localStorage.setItem('sl_refresh_token', authData.refresh_token);
    localStorage.setItem('sl_auth', '1');

    // Charger le profil
    const profile = await sbGetProfile(authData.user.id, authData.access_token);
    const role = profile?.role || 'employe';

    localStorage.setItem('sl_user', JSON.stringify({
      id:        authData.user.id,
      email:     authData.user.email,
      role,
      tenant_id: profile?.tenant_id || null,
    }));

    btn.textContent = '✓ Connecté !';

    setTimeout(() => {
      if (role === 'superadmin' || role === 'admin') {
        window.location.replace('admin.html');
      } else {
        window.location.replace('hub.html');
      }
    }, 500);

  } catch(e) {
    btn.disabled = false;
    btn.textContent = 'Se connecter';
    btn.classList.remove('btn-loading');
    showError('Erreur réseau — vérifie ta connexion.');
    console.error(e);
  }
}

async function forgotPassword() {
  const email = document.getElementById('email').value.trim();
  if (!email) { showError('Entre ton email avant de continuer.'); return; }
  try {
    await fetch(`${SUPABASE_URL}/auth/v1/recover`, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'apikey': SUPABASE_ANON },
      body: JSON.stringify({ email }),
    });
    const el = document.getElementById('error-msg');
    el.style.cssText = 'display:block;background:rgba(76,219,138,.1);border:1px solid rgba(76,219,138,.3);color:var(--green)';
    el.textContent = '✓ Email de réinitialisation envoyé.';
  } catch(e) { showError('Erreur réseau.'); }
}

// Vérifier si déjà connecté — seulement si on ne vient PAS d'un redirect
async function checkExistingSession() {
  // Si on arrive avec ?from=admin ou ?from=hub c'est un redirect — ne pas boucler
  const params = new URLSearchParams(window.location.search);
  if (params.get('from')) return;

  const token = localStorage.getItem('sl_access_token');
  if (!token) return;

  try {
    const r = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
      headers: { 'apikey': SUPABASE_ANON, 'Authorization': `Bearer ${token}` }
    });
    if (!r.ok) {
      // Token invalide — nettoyer
      localStorage.removeItem('sl_access_token');
      localStorage.removeItem('sl_refresh_token');
      localStorage.removeItem('sl_auth');
      localStorage.removeItem('sl_user');
      return;
    }
    const user = await r.json();
    const profile = await sbGetProfile(user.id, token);
    const role = profile?.role || 'employe';
    localStorage.setItem('sl_user', JSON.stringify({ id:user.id, email:user.email, role, tenant_id:profile?.tenant_id }));
    if (role === 'superadmin' || role === 'admin') window.location.replace('admin.html');
    else window.location.replace('hub.html');
  } catch(e) {
    // En cas d'erreur réseau — ne pas rediriger, laisser l'utilisateur se connecter manuellement
    console.warn('Session check failed:', e);
  }
}

checkExistingSession();
</script>
