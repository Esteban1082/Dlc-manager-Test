<style>
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  :root {
    --bg:#161412; --surface:#211e1b; --surface2:#2b2723; --border:#3a342e; --text:#f4efe7; --muted:#a3978a;
    --accent:#e8a045; --link:#f0b264; --red:#ff7a6e; --red-bg:rgba(255,122,110,.12); --yellow:#f0b450; --yellow-bg:rgba(240,180,80,.12);
    --green:#6fcf97; --green-bg:rgba(111,207,151,.12); --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.25);
  }
  html[data-theme="light"] {
    --bg:#f4efe7; --surface:#fffcf7; --surface2:#f1e6d6; --border:#e2d7c9; --text:#23201c; --muted:#6e6256;
    --accent:#e8a045; --link:#a8540f; --red:#b3261e; --red-bg:#fbece9; --yellow:#8a5a00; --yellow-bg:#fbf2e1;
    --green:#2f6b45; --green-bg:#ecf3ec; --shadow:0 1px 2px rgba(60,40,20,.05), 0 10px 28px rgba(60,40,20,.08);
  }
  body { background:var(--bg); color:var(--text); font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Helvetica Neue', sans-serif; min-height:100vh; -webkit-font-smoothing:antialiased; }
  a { color:inherit; text-decoration:none; }
  button { font-family:inherit; cursor:pointer; }
  .serif { font-family:'Fraunces', Georgia, serif; }
  .wrap { max-width:720px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 28px) 18px 60px; }
  .top { display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .date-line { font-size:13px; font-weight:600; color:var(--muted); }
  h1 { font-family:'Fraunces', Georgia, serif; font-weight:600; font-size:34px; letter-spacing:-.8px; line-height:1.1; }
  .top-actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-end; }
  .pill-btn { height:34px; padding:0 13px; border-radius:17px; border:1px solid var(--border); background:var(--surface); color:var(--muted); font-size:12px; font-weight:600; display:inline-flex; align-items:center; }

  .dlc-card { display:block; margin-top:22px; border-radius:22px; padding:20px; background:var(--surface); box-shadow:var(--shadow); transition:transform .15s; }

  .stat span { font-size:12px; color:var(--muted); font-weight:500; }

<script>
(function(){
  function applyStoreLineTheme(theme) {
    var next = theme === 'dark' ? 'dark' : 'light';
    if (next === 'light') document.documentElement.dataset.theme = 'light'; else delete document.documentElement.dataset.theme;
    try { localStorage.setItem('sl_ui_theme', next); } catch(e) {}
    var btn = document.getElementById('theme-toggle-global');
    if (btn) btn.textContent = next === 'light' ? 'Sombre' : 'Clair';
  }
  window.toggleStoreLineTheme = function() {
    applyStoreLineTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light');
  };
  applyStoreLineTheme(document.documentElement.dataset.theme === 'light' ? 'light' : 'dark');
})();
</script>
<script>
// ── Auth : check immédiat avant le rendu ──
const SUPABASE_URL  = 'https://jeqptodorjzeyhapbmrz.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImplcXB0b2Rvcmp6ZXloYXBibXJ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NjI0ODksImV4cCI6MjA4OTIzODQ4OX0.j4JqeDnDMEghnBtKy5Knpb4QYDFEXiRtDeq7SSz3zWk';
const PWD_HASH = "15197cf7214b58e67cae565e573ffd9aa44bcb81f8ee5d7185dfe8da0a16ef43";

function isAuth() { return localStorage.getItem('sl_auth') === '1' || localStorage.getItem('pm_auth') === '1'; }

function showLock() {
  const ls = document.getElementById('lock-screen');
  ls.style.display = 'flex';
  document.querySelectorAll('.tile').forEach(t => t.classList.add('locked'));
  setTimeout(() => document.getElementById('pwd-input').focus(), 100);
}

function hideLock() {
  document.getElementById('lock-screen').style.display = 'none';
  document.querySelectorAll('.tile').forEach(t => t.classList.remove('locked'));
}

async function checkPassword() {
  const val = document.getElementById('pwd-input').value;
  const buf  = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(val));
  const hash = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  if (hash === PWD_HASH) {
    localStorage.setItem('pm_auth', '1');
    localStorage.setItem('sl_auth', '1');
    hideLock();
  } else {
    const err = document.getElementById('pwd-error');
    err.textContent = '⚠ Code incorrect';
    document.getElementById('pwd-input').value = '';
    setTimeout(() => err.textContent = '', 2000);
  }
}

// Exécuté dès que le DOM est prêt
document.addEventListener('DOMContentLoaded', () => {
  if (isAuth()) {
    hideLock();
  } else {
    showLock();
  }
});

function logout() {
  localStorage.removeItem('sl_auth');
  localStorage.removeItem('sl_access_token');
  localStorage.removeItem('sl_refresh_token');
  localStorage.removeItem('sl_user');
  localStorage.removeItem('pm_auth');
  window.location.replace('index.html');
}

async function sbRpcScalar(functionName, accessToken) {
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${functionName}`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON,
        'Authorization': `Bearer ${accessToken}`,
      },
      body: '{}',
    });
    if (!r.ok) return null;
    const text = await r.text();
    return text ? JSON.parse(text) : null;
  } catch(e) {
    console.warn(`RPC ${functionName} failed:`, e);
    return null;
  }
}

async function repairSupabaseSessionIfNeeded() {
  const token = localStorage.getItem('sl_access_token');
  const storedUser = JSON.parse(localStorage.getItem('sl_user') || '{}');
  if (!token || storedUser.tenant_id) return storedUser;

  try {
    const userResp = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
      headers: { 'apikey': SUPABASE_ANON, 'Authorization': `Bearer ${token}` },
    });
    if (!userResp.ok) return storedUser;
    const authUser = await userResp.json();

    let profile = null;
    const profileResp = await fetch(`${SUPABASE_URL}/rest/v1/profiles?id=eq.${authUser.id}&select=role,tenant_id`, {
      headers: { 'apikey': SUPABASE_ANON, 'Authorization': `Bearer ${token}` },
    });
    if (profileResp.ok) {
      const data = await profileResp.json();
      profile = Array.isArray(data) ? data[0] : null;
    }

    if (!profile?.role || !profile?.tenant_id) {
      const [role, tenantId] = await Promise.all([
        sbRpcScalar('my_role', token),
        sbRpcScalar('my_tenant_id', token),
      ]);
      profile = {
        role: profile?.role || role || storedUser.role || 'employe',
        tenant_id: profile?.tenant_id || tenantId || null,
      };
    }

    const repairedUser = {
      id: authUser.id || storedUser.id,
      email: authUser.email || storedUser.email,
      role: profile?.role || storedUser.role || 'employe',
      tenant_id: profile?.tenant_id || storedUser.tenant_id || null,
    };
    localStorage.setItem('sl_user', JSON.stringify(repairedUser));
    return repairedUser;
  } catch(e) {
    console.warn('Session repair failed:', e);
    return storedUser;
  }
}

// Afficher le bouton déco seulement si connecté via Supabase
document.addEventListener('DOMContentLoaded', async () => {
  // Connexion Supabase (StoreLine)
  const slToken = localStorage.getItem('sl_access_token');
  let slUser  = JSON.parse(localStorage.getItem('sl_user') || '{}');
  if (slToken) {
    slUser = await repairSupabaseSessionIfNeeded();
    const logoutBtn = document.getElementById('logout-btn');
    if (logoutBtn) logoutBtn.style.display = 'block';
    // Bouton Admin visible pour superadmin et admin
    if (['superadmin','admin'].includes(slUser.role)) {
      const adminBtn = document.getElementById('admin-btn');
      if (adminBtn) adminBtn.style.display = 'inline-flex';
    }
    if (slUser.email) {
      const raw = slUser.email.split('@')[0].split(/[._-]/)[0] || '';
      const first = raw.charAt(0).toUpperCase() + raw.slice(1);
      document.getElementById('hello').textContent = first ? 'Bonjour ' + first : 'Bonjour';
      document.getElementById('avatar').textContent = (first.charAt(0) || 'S');
    }
    loadDlcCounts(slToken, slUser).catch(e => console.warn('Compteurs DLC:', e));
  }
});


// ── Compteurs DLC (filtrés sur les blocs de l'utilisateur) ──
function hubNorm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim(); }
async function hubGet(path, token) {
  const r = await fetch(SUPABASE_URL + path, { headers: { 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + token } });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
async function loadDlcCounts(token, user) {
  if (!user || !user.tenant_id) return;
  const rows = await hubGet('/rest/v1/dlc?tenant_id=eq.' + encodeURIComponent(user.tenant_id) + '&actif=eq.true&select=nom,marque,code_barres,dlc_date', token);
  let blocs = [];
  try {
    const br = await hubGet('/rest/v1/dlc_blocs_users?user_id=eq.' + encodeURIComponent(user.id) + '&select=dlc_blocs(nom,actif,dlc_blocs_marques(marque),dlc_blocs_produits(nom,marque,code_barres))', token);
    blocs = (br || []).map(x => x.dlc_blocs).filter(b => b && b.actif !== false);
  } catch(e) {}
  const inBlocs = (p) => {
    if (!blocs.length) return true;
    const m = hubNorm(p.marque), n = hubNorm(p.nom), c = String(p.code_barres || '').trim();
    return blocs.some(b => (b.dlc_blocs_marques || []).some(x => hubNorm(x.marque) === m) ||
      (b.dlc_blocs_produits || []).some(x => (c && String(x.code_barres || '').trim() === c) || (hubNorm(x.nom) === n && hubNorm(x.marque) === m)));
  };
  const today = new Date(); today.setHours(0,0,0,0);
  const c = { red: 0, soon: 0, ok: 0 };
  const mine = (rows || []).filter(inBlocs).map(p => ({ ...p, d: Math.round((new Date(p.dlc_date + 'T00:00:00') - today) / 86400000) }));
  mine.forEach(p => { if (p.d <= 0) c.red++; else if (p.d <= 7) c.soon++; else c.ok++; });
  renderDlcPreview(mine.filter(p => p.d <= 7).sort((a, b) => a.d - b.d));
  document.getElementById('n-red').textContent = c.red;
  document.getElementById('n-soon').textContent = c.soon;
  document.getElementById('n-ok').textContent = c.ok;
  document.getElementById('dlc-stats').style.display = 'grid';
  document.getElementById('dlc-sub').textContent = c.red ? (c.red + ' produit' + (c.red > 1 ? 's' : '') + ' à retirer aujourd’hui') : 'Tout est sous contrôle';
}

function renderDlcPreview(items) {
  const el = document.getElementById('dlc-preview');
  if (!el) return;
  if (!items.length) { el.innerHTML = '<div class="pv-empty">Rien à retirer ni à surveiller cette semaine.</div>'; return; }
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const when = d => d < 0 ? 'Périmé ' + (-d) + ' j' : d === 0 ? 'Aujourd’hui' : d === 1 ? 'Demain' : 'Dans ' + d + ' j';
  const max = 6;
  el.innerHTML = '<div class="pv-title">À traiter en priorité</div>' + items.slice(0, max).map(p =>
    `<div class="pv-row"><span class="pv-main"><span class="pv-name">${esc(p.nom)}</span><span class="pv-brand">${esc(p.marque)}</span></span><span class="pv-pill ${p.d <= 0 ? 'red' : 'yellow'}">${when(p.d)}</span></div>`).join('')
    + (items.length > max ? `<div class="pv-more">+ ${items.length - max} autre${items.length - max > 1 ? 's' : ''} dans le suivi</div>` : '');
}

function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent = now.toLocaleTimeString('fr-BE', { hour:'2-digit', minute:'2-digit' });
  const d = now.toLocaleDateString('fr-BE', { weekday:'long', day:'numeric', month:'long' });
  document.getElementById('date-str').textContent = d.charAt(0).toUpperCase() + d.slice(1);
}
updateClock(); setInterval(updateClock, 30000);
</script>
