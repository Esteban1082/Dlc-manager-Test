  return fetch(url, opts).catch(function () { throw new Error('Pas de connexion. Réessaie dans un instant.'); });

window.slErrMsg = function (status, data) {
  var code = data && data.code, msg = String((data && (data.message || data.error_description || data.error)) || '');

  if (code === '22P02' || code === '23502' || code === '23514' || code === '22007' || code === '22008') return 'Donnée invalide, vérifie les champs';
  if (status >= 500) return 'Le serveur ne répond pas, réessaie dans un instant';

async function sbAll(path) {
  const out = [];
  for (let off = 0; ; off += 1000) {
    const page = await sbFetch(path + (path.includes('?') ? '&' : '?') + 'limit=1000&offset=' + off);

}

  try { return { rows: await sbAll(path) }; }

      want.net ? tryAll(`/rest/v1/checklists?tenant_id=eq.${t}&actif=eq.true&select=id,nom,taches&order=ordre.asc`) : { rows: [] },
      want.net ? tryAll(`/rest/v1/checklist_etats?tenant_id=eq.${t}&jour=gte.${from}&jour=lte.${to}&select=checklist_id,tache_id,jour`) : { rows: [] },
      want.all ? tryAll(`/rest/v1/allergenes?tenant_id=eq.${t}&select=*&order=nom_gateau.asc`) : { rows: [] },
    ]);
    render({ from, to, want, magasin: (ten.rows[0] || {}).nom || 'Mon magasin', temps, zones: zones.rows, histo, cls, etats: etats.rows, alls });
    document.getElementById('setup').style.display = 'none';
    document.getElementById('report').style.display = 'block';
    window.scrollTo(0, 0);
    status('');
  } catch (e) { status(e.message, true); }
  finally { btn.disabled = false; }
}

function render(d) {
  const nbDays = Math.round((parseISO(d.to) - parseISO(d.from)) / 86400000) + 1;
  const days = Array.from({ length: nbDays }, (_, i) => addDays(d.from, i));
  const T = d.temps.rows, Z = d.zones;
  const zoneOf = r => Z.find(z => z.id === r.zone_id) || Z.find(z => z.nom === r.zone_nom);
  const daysWithTemp = new Set(T.map(r => r.date_releve));
  const today = localISO();
  const firstTemp = T.reduce((m, r) => (!m || r.date_releve < m ? r.date_releve : m), '');
  // Jours manquants : depuis le premier relevé enregistré, dimanches exclus, aujourd'hui pas encore compté
  const missing = firstTemp ? days.filter(x => x >= firstTemp && x < today && !daysWithTemp.has(x) && parseISO(x).getDay() !== 0) : [];
  const nc = T.filter(r => r.hors_norme);
  const ncNoAction = nc.filter(r => !r.action_corrective);
  const H = d.histo.rows;
  let netDone = 0, netTotal = 0;
  const etatSet = new Set(d.etats.map(e => e.checklist_id + '|' + e.tache_id + '|' + e.jour));
  const firstNet = d.etats.reduce((m, e) => (!m || e.jour < m ? e.jour : m), '');
  const daysNet = firstNet ? days.filter(x => parseISO(x).getDay() !== 0 && x >= firstNet && (x < today || d.etats.some(e => e.jour === x))) : [];
  (d.cls.rows || []).forEach(c => (c.taches || []).forEach(tk => daysNet.forEach(x => { netTotal++; if (etatSet.has(c.id + '|' + tk.id + '|' + x)) netDone++; })));
  const A = d.alls.rows;
  const unknownAll = A.filter(f => ALLERGENS.some(([k]) => !f[k] || f[k] === 'inconnu'));

  let h = `<h2>Dossier d’autocontrôle</h2>
    <div class="meta"><b>${esc(d.magasin)}</b> · du ${fmt(d.from)} au ${fmt(d.to)} · généré le ${new Date().toLocaleDateString('fr-BE')} à ${new Date().toLocaleTimeString('fr-BE', { hour: '2-digit', minute: '2-digit' })} par ${esc(me.email || '')}</div>
    <div class="kpis">
      ${d.want.temp ? `<div class="kpi ${missing.length ? 'bad' : ''}"><b>${daysWithTemp.size}/${daysWithTemp.size + missing.length}</b><span>jours avec relevé de températures</span></div>
      <div class="kpi ${ncNoAction.length ? 'bad' : ''}"><b>${nc.length}</b><span>hors norme${nc.length ? `, dont ${nc.length - ncNoAction.length} avec action corrective` : ''}</span></div>` : ''}
      ${d.want.dlc ? `<div class="kpi"><b>${H.length}</b><span>produits retirés à date (DLC)</span></div>` : ''}
      ${d.want.net ? `<div class="kpi"><b>${netTotal ? Math.round(netDone / netTotal * 100) + ' %' : '—'}</b><span>tâches de nettoyage cochées</span></div>` : ''}
      ${d.want.all ? `<div class="kpi ${unknownAll.length ? 'bad' : ''}"><b>${A.length}</b><span>fiches allergènes${unknownAll.length ? `, ${unknownAll.length} incomplète${unknownAll.length > 1 ? 's' : ''}` : ''}</span></div>` : ''}
    </div>`;

  if (d.want.temp) {
    h += `<h3>1. Températures des équipements frigorifiques</h3>`;
    if (d.temps.err) h += `<div class="empty">Section indisponible : ${esc(d.temps.err)}</div>`;
    else if (!T.length) h += `<div class="empty">Aucun relevé sur la période.</div>`;
    else {
      // Grille : une ligne par jour, une colonne par équipement (comme le registre papier)
      const cols = Z.filter(z => z.actif !== false || T.some(r => r.zone_id === z.id));
      T.forEach(r => { if (!zoneOf(r) && !cols.some(c => c._nom === r.zone_nom)) cols.push({ id: null, _nom: r.zone_nom, nom: r.zone_nom }); });
      const colOf = r => cols.find(c => (c.id && c.id === r.zone_id)) || cols.find(c => c.nom === r.zone_nom);
      const byDay = new Map();
      T.forEach(r => { const k = r.date_releve; if (!byDay.has(k)) byDay.set(k, new Map()); const m = byDay.get(k), c = colOf(r); if (!m.has(c)) m.set(c, []); m.get(c).push(r); });
      const gridDays = days.filter(x => byDay.has(x) || missing.includes(x));
      if (firstTemp > d.from) h += `<div class="note">Premier relevé enregistré dans StoreLine le ${fmt(firstTemp)}.</div>`;
      h += `<table class="grid"><thead><tr><th>Date</th>${cols.map(c => `<th>${esc(c.nom)}${c.temp_min != null ? `<span class="note"><br>${dec(c.temp_min)} à ${dec(c.temp_max)} °C</span>` : ''}</th>`).join('')}</tr></thead><tbody>`
        + gridDays.map(x => { const m = byDay.get(x); if (!m) return `<tr class="miss"><td>${fmt(x, { weekday: 'short', day: '2-digit', month: '2-digit' })}</td><td colspan="${cols.length}"><span class="ko">Pas de relevé</span></td></tr>`;
            return `<tr><td>${fmt(x, { weekday: 'short', day: '2-digit', month: '2-digit' })}</td>${cols.map(c => { const rs = m.get(c) || []; return `<td>${rs.map(r => `<span class="${r.hors_norme ? 'ko' : ''}">${dec(r.valeur)}</span>`).join(' / ') || '<span class="note">—</span>'}</td>`; }).join('')}</tr>`; }).join('')
        + `</tbody></table>`;
      h += `<h4>Écarts et actions correctives</h4>`;
      if (!nc.length) h += `<div class="empty">Aucun relevé hors norme sur la période.</div>`;
      else h += `<table><thead><tr><th>Date</th><th>Heure</th><th>Équipement</th><th>Relevé</th><th>Action corrective</th></tr></thead><tbody>`
        + nc.map(r => { const z = zoneOf(r); return `<tr class="nc"><td>${fmt(r.date_releve)}</td><td>${esc(String(r.heure || '').slice(0, 5))}</td><td>${esc(r.zone_nom)}</td><td><b class="ko">${dec(r.valeur)} °C</b>${z ? `<span class="note"> (${dec(z.temp_min)} à ${dec(z.temp_max)})</span>` : ''}</td><td>${r.action_corrective ? esc(r.action_corrective) + (r.action_par ? `<span class="note"> — ${esc(r.action_par)}</span>` : '') : '<span class="ko">Non renseignée</span>'}</td></tr>`; }).join('')
        + `</tbody></table>`;
    }
    if (missing.length) h += `<div class="note">${missing.length} jour${missing.length > 1 ? 's' : ''} sans relevé (dimanches exclus) : ${missing.map(x => fmt(x, { day: '2-digit', month: '2-digit' })).join(', ')}.</div>`;
  }

  if (d.want.dlc) {
    h += `<h3>${d.want.temp ? 2 : 1}. Retraits de produits arrivés à date limite</h3>`;
    if (d.histo.err) h += `<div class="empty">Section indisponible : ${esc(d.histo.err)}</div>`;
    else if (!H.length) h += `<div class="empty">Aucun retrait enregistré sur la période.</div>`;
    else h += `<table><thead><tr><th>Retiré le</th><th>Produit</th><th>Marque</th><th>DLC</th><th>Par</th></tr></thead><tbody>`
      + H.map(r => `<tr><td>${fmtTs(r.created_at)}</td><td>${esc(r.nom)}</td><td>${esc(r.marque)}</td><td>${r.old_dlc ? fmt(r.old_dlc) : '—'}</td><td>${esc(r.user_email || '')}</td></tr>`).join('') + `</tbody></table>`;
  }

  if (d.want.net) {
    const n = [d.want.temp, d.want.dlc].filter(Boolean).length + 1;
    h += `<h3>${n}. Nettoyage et tâches quotidiennes</h3>`;
    const C = d.cls.rows || [];
    if (d.cls.err) h += `<div class="empty">Section indisponible : ${esc(d.cls.err)}</div>`;
    else if (!C.length) h += `<div class="empty">Aucune checklist configurée (module Documents).</div>`;
    else {
      const rows = daysNet;
      if (!rows.length) h += `<div class="empty">Aucune tâche cochée sur la période.</div>`;
      else if (firstNet > d.from) h += `<div class="note">Première tâche cochée dans StoreLine le ${fmt(firstNet)}.</div>`;
      if (rows.length) h += `<table><thead><tr><th>Date</th>${C.map(c => `<th>${esc(c.nom)}</th>`).join('')}</tr></thead><tbody>`
        + rows.map(x => `<tr><td style="white-space:nowrap">${fmt(x, { weekday: 'short', day: '2-digit', month: '2-digit' })}</td>${C.map(c => { const tot = (c.taches || []).length, done = (c.taches || []).filter(tk => etatSet.has(c.id + '|' + tk.id + '|' + x)).length; return `<td class="${tot && done === tot ? 'ok' : done ? '' : 'ko'}">${done}/${tot}</td>`; }).join('')}</tr>`).join('')
        + `</tbody></table>`;
      h += `<div class="note">Tâches actuelles : ${C.map(c => `<b>${esc(c.nom)}</b> — ${(c.taches || []).map(tk => esc(tk.label)).join(', ')}`).join(' · ')}</div>`;
    }
  }

  if (d.want.all) {
    const n = [d.want.temp, d.want.dlc, d.want.net].filter(Boolean).length + 1;
    h += `<div class="sec-allerg"><h3>${n}. Allergènes — denrées vendues non préemballées</h3>`;
    if (d.alls.err) h += `<div class="empty">Section indisponible : ${esc(d.alls.err)}</div>`;
    else if (!A.length) h += `<div class="empty">Aucune fiche allergènes.</div>`;
    else {
      h += `<div class="note">● contient · — absent · ? à vérifier. Les 14 allergènes du règlement (UE) n° 1169/2011.</div>
        <table class="al"><thead><tr><th>Produit</th>${ALLERGENS.map(([, l]) => `<th><div class="vert">${l}</div></th>`).join('')}</tr></thead><tbody>`
        + A.map(f => `<tr><td><b>${esc(f.nom_gateau)}</b>${f.patissier ? `<span class="note"> · ${esc(f.patissier)}</span>` : ''}</td>${ALLERGENS.map(([k]) => { const v = f[k]; return v === 'oui' ? '<td class="c">●</td>' : v === 'non' ? '<td class="a">—</td>' : '<td class="u">?</td>'; }).join('')}</tr>`).join('')
        + `</tbody></table>`;
    }
    h += `__FOOT__</div>`;
  }

  h += `<div class="foot">Document généré par StoreLine à partir des enregistrements de l’autocontrôle du magasin. Il rassemble les traces disponibles et ne remplace pas la validation officielle du système d’autocontrôle.</div>`;
  const foot = h.slice(h.lastIndexOf('<div class="foot">'));
  if (h.includes('__FOOT__')) h = h.slice(0, h.lastIndexOf('<div class="foot">')).replace('__FOOT__', foot);
  document.getElementById('paper').innerHTML = h;
}

function init() {
  me = JSON.parse(localStorage.getItem('sl_user') || '{}');
  setPeriod('m0');
  if (!me.tenant_id) status('Magasin introuvable pour ce compte', true);
}
function _runWhenReady() {
  if (window.__guardPassed === true) init();
  else if (window.__guardPassed === false) {}
  else setTimeout(_runWhenReady, 50);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', _runWhenReady); else _runWhenReady();
</script>
</body>
</html>
